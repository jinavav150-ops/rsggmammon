<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricochet Squad 전적검색 · RS.GG</title>
<style>
:root{
  --bg:#0e1015; --panel:#171a21; --panel2:#1e2230; --line:#2a2f3d; --tx:#e8eaf0; --mut:#9aa3b2;
  --acc:#4a86ff; --acc2:#7db1ff; --gold:#e8b923; --silver:#c4cdd8; --bronze:#cd8248;
  --win:#3fb27f; --lose:#e06c75;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f2f4f8;--panel:#fff;--panel2:#f7f9fc;--line:#e2e6ee;--tx:#1a1e27;--mut:#69707e;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px}
a{color:inherit;text-decoration:none;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hd{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
.logo span{background:linear-gradient(90deg,var(--acc),#8f6bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo .emb{width:28px;height:28px;flex:none;filter:drop-shadow(0 2px 6px rgba(74,134,255,.35))}
.ic{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .ic,.tab .ic{vertical-align:-.18em}
.mammon{background:linear-gradient(90deg,#d99e12,#ffd76b 55%,#f2b829);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:1px}
.owner{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.owner svg{width:14px;height:14px;fill:none;stroke:#e8b923;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
footer .crown{width:15px;height:15px;fill:none;stroke:#e8b923;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;vertical-align:-2px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--mut)}
.search{flex:1;min-width:200px;display:flex;gap:8px}
.search input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:9px 12px;font-size:14px;outline:none}
.search input:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}
.tab{padding:7px 13px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-weight:600;font-size:13px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab.hero.on{background:#6b4bd6;border-color:#6b4bd6}
.row-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select,.mini{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:12px;font-weight:600;background:var(--panel2)}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{font-weight:800;width:52px;text-align:center}
.r1{color:var(--gold)}.r2{color:var(--silver)}.r3{color:var(--bronze)}
.name{font-weight:700}
.reg{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:2px}
.wr{font-weight:700}.wrh{color:var(--win)}.wrl{color:var(--lose)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px}
.pager button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.muted{color:var(--mut)}
/* profile */
.pf-top{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap}
.pf-av{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--acc),#6b4bd6);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff}
.pf-name{font-size:24px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:0 16px 16px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .k{font-size:12px;color:var(--mut)}
.stat .v{font-size:20px;font-weight:800;margin-top:3px}
.sect-t{font-weight:800;font-size:15px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.sect-t .ic{color:var(--acc)}
.pct{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px;display:inline-block;vertical-align:middle;width:90px}
.pct>i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;margin:3px;font-size:12px}
.back{display:inline-block;margin:14px 0;color:var(--acc);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* 최근 경기 테이블 */
.mtab{width:100%;border-collapse:collapse;font-size:13px;min-width:660px}
.mtab th{color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.4px;padding:10px 12px;text-align:left;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
.mtab td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtab th.num,.mtab td.num{text-align:right;font-variant-numeric:tabular-nums}
.mrow{cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.mrow.win{border-left-color:var(--win)} .mrow.loss{border-left-color:var(--lose)}
.mrow:hover{background:var(--panel2)}
.rb{display:inline-block;font-weight:800;border-radius:5px;padding:2px 9px;font-size:12px;color:#fff}
.rb.win{background:var(--win)} .rb.loss{background:var(--lose)}
.mvpb{background:linear-gradient(90deg,#e0a90f,#ffd76b);color:#1a1a1a;font-weight:800;font-size:10px;border-radius:4px;padding:2px 5px}
.hcell{font-weight:700}
.mdet>td{background:var(--panel2);border-bottom:2px solid var(--line)}
.plink{color:var(--acc2);cursor:pointer;font-weight:600}
.plink:hover{text-decoration:underline}
/* 캐릭터별 상세 카드형 목록 (모바일 대응) */
.hrow{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hrow:last-child{border-bottom:none}
.hrow .hn{font-weight:700}
.hrow .lv{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px;color:var(--mut);margin-left:5px;font-weight:600}
.hrow .hm{color:var(--mut);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hrow .hm b{color:var(--tx);font-weight:700}
.hrow .pk{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:1px}
.hrow .pk .pkl{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.3px}
.hi{width:22px;height:26px;border-radius:5px;object-fit:cover;vertical-align:middle;margin-right:5px;background:var(--panel2)}
.hi-lg{width:34px;height:40px;border-radius:7px}
.hrow>div:first-child{flex:0 0 auto;display:flex;align-items:center;white-space:nowrap}
.sbp{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:3px 0 8px 12px}
.sbp .hh{font-size:10.5px;color:var(--mut);font-weight:700;align-self:center}
.pkb{width:31px;height:31px;padding:0;border:none;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.pkb img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.pkb:hover{filter:brightness(1.15) drop-shadow(0 0 4px rgba(255,255,255,.3))}
.pkb:active{transform:scale(.93)}
.pkb.sm{width:26px;height:26px}

#perkTip{position:fixed;z-index:60;display:none;max-width:min(280px,88vw);background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 10px 28px rgba(0,0,0,.4)}
/* 좁은 화면: 최근경기 덜 중요한 열 접기 */
@media(max-width:600px){.mtab{min-width:0} .hcol{display:none} .mtab th,.mtab td{padding:7px 6px;font-size:12px}}
footer{color:var(--mut);font-size:12px;text-align:center;padding:24px}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="logo" href="#/board/프로">
    <svg class="emb" viewBox="0 0 32 32" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4a86ff"/><stop offset="1" stop-color="#8f6bff"/></linearGradient></defs>
      <path d="M16 2.5 27.5 8.6v9.2c0 6.2-4.6 10.4-11.5 13.2C9.1 28.2 4.5 24 4.5 17.8V8.6L16 2.5Z"
        fill="url(#lg)" fill-opacity="0.16" stroke="url(#lg)" stroke-width="1.6"/>
      <circle cx="16" cy="15" r="5.4" stroke="url(#lg)" stroke-width="1.6"/>
      <circle cx="16" cy="15" r="1.7" fill="url(#lg)"/>
      <path d="M16 6.3v3.3M16 20.4v3.3M6.9 15h3.3M21.8 15h3.3" stroke="url(#lg)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    RS<span>.GG</span></a>
  <span class="badge" id="seasonBadge">시즌</span>
  <span class="owner" title="제작 · 운영">
    <svg viewBox="0 0 24 24"><path d="M4 9l4 3 4-6 4 6 4-3-1.5 10H5.5L4 9Z"/><path d="M5.5 19h13"/></svg>
    by <span class="mammon">MAMMON</span></span>
  <div class="search">
    <input id="q" placeholder="닉네임 검색 (예: earth, GG, レオ)" autocomplete="off">
    <button class="btn" onclick="doSearch()">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg> 검색</button>
  </div>
</div></header>

<div class="wrap" id="app"></div>
<footer>
  <div style="margin-bottom:6px">
    <svg class="crown" viewBox="0 0 24 24"><path d="M4 9l4 3 4-6 4 6 4-3-1.5 10H5.5L4 9Z"/><path d="M5.5 19h13"/></svg>
    Created &amp; owned by <span class="mammon" style="font-size:14px">MAMMON</span>
  </div>
  Ricochet Squad 비공식 전적검색 · 데이터 <span id="cnt"></span>명 · © 2026 MAMMON. All rights reserved.
</footer>

<div id="perkTip"></div>
<script src="site_data.js"></script>
<script>
const D=window.DATA, P=D.players, B=D.boards, BM=D.board_meta;
document.getElementById('seasonBadge').textContent='시즌 '+D.season.slice(0,4)+'-'+D.season.slice(4);
document.getElementById('cnt').textContent=D.generated_count.toLocaleString();

// 이름 검색 인덱스
const NAMEIDX=[];
for(const id in P){
  NAMEIDX.push([P[id].n.toLowerCase(), id, null]);           // 현재 닉네임
  (P[id].prev||[]).forEach(pn=>{ if(pn) NAMEIDX.push([pn.toLowerCase(), id, pn]); });  // 이전 닉네임
}

const app=document.getElementById('app');
const ICON={
  trophy:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22"/><path d="M14 14.7V17c0 .6.5 1 1 1.2C16.1 18.8 17 20.2 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
  target:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>',
  history:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>',
  refresh:'<svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v4h-4"/></svg>',
};
const HERO_KR={Dread:"드레드",Khan:"칸",Vector:"벡터",Oni:"오니",Remedy:"레메디",Sejin:"세진",Twinkle:"트윙클",Jagger:"재거",Calibri:"칼리브리",Leo:"레오",Magnus:"망누스",Nova:"노바",Fury:"퓨리"};
const hk=n=>HERO_KR[n]||n;  // 캐릭명만 한글로 (닉네임 등은 원본 유지)
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wrClass=w=>w==null?'':(w>=50?'wrh':'wrl');
function heroImg(n,cls){const f=String(n||'').toLowerCase();if(!f||f[0]==='#')return '';
  return `<img class="hi ${cls||''}" src="img/hero/${f}.png" alt="" loading="lazy" onerror="this.style.display='none'">`;}
// 퍽 = 게임의 육각 배지. 분류(type 0~8)가 곧 배지 그림
function perkChips(arr,sm){return (arr||[]).map(p=>{
  const a=Array.isArray(p); const n=a?p[0]:p;
  const t=(a&&p[1]>=0&&p[1]<=8)?p[1]:0;
  return `<button type="button" class="pkb${sm?' sm':''}" data-t="${esc(n)}" title="${esc(n)}" onclick="showPerk(event,this)"><img src="img/perk/${t}.png" alt=""></button>`;
}).join('');}
window.showPerk=(ev,el)=>{ev.stopPropagation();const tip=document.getElementById('perkTip');
  if(tip.style.display==='block'&&tip._el===el){tip.style.display='none';return;}
  tip.textContent=el.dataset.t||''; tip._el=el; tip.style.display='block'; tip.style.left='0px'; tip.style.top='0px';
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let l=Math.max(8,Math.min(r.left+r.width/2-w/2, innerWidth-w-8));
  let t=r.top-h-8; if(t<8) t=r.bottom+8;
  tip.style.left=l+'px'; tip.style.top=t+'px';};
const hidePerkTip=()=>{const t=document.getElementById('perkTip'); if(t)t.style.display='none';};
document.addEventListener('click',hidePerkTip);
window.addEventListener('scroll',hidePerkTip,true);
function medalCls(r){return r===1?'r1':r===2?'r2':r===3?'r3':''}

let curBoard='프로', curPage=0, curRegion='', curFilter='';
const PAGE=100;

function tabsHtml(){
  let modes=['프로','캐주얼'];
  let h='<div class="tabs">';
  for(const m of modes) h+=`<div class="tab ${curBoard===m?'on':''}" onclick="goBoard('${m}')">${m}</div>`;
  h+=`<select class="tab hero ${D.hero_labels.includes(curBoard)?'on':''}" onchange="goBoard(this.value)" style="min-width:120px">`;
  h+=`<option value="">캐릭터별▾</option>`;
  for(const hl of D.hero_labels) h+=`<option value="${hl}" ${curBoard===hl?'selected':''}>${hk(hl)}</option>`;
  h+='</select></div>';
  return h;
}

function regionOptions(){
  const set=new Set(); for(const id in P) if(P[id].r) set.add(P[id].r);
  let h=`<select onchange="curRegion=this.value;curPage=0;render()"><option value="">전체 지역</option>`;
  for(const r of [...set].sort()) h+=`<option value="${r}" ${curRegion===r?'selected':''}>${r}</option>`;
  return h+'</select>';
}

function renderBoard(){
  const ids=B[curBoard]||[];
  let rows=ids.map((id,i)=>({id,rank:i+1}));
  if(curRegion) rows=rows.filter(r=>P[r.id].r===curRegion);
  if(curFilter){const f=curFilter.toLowerCase(); rows=rows.filter(r=>P[r.id].n.toLowerCase().includes(f));}
  const total=rows.length, pages=Math.max(1,Math.ceil(total/PAGE));
  if(curPage>=pages)curPage=0;
  const slice=rows.slice(curPage*PAGE,curPage*PAGE+PAGE);
  const size=BM[curBoard]?.size||ids.length;
  let h=tabsHtml();
  h+=`<div class="row-filter">${regionOptions()}
    <input class="mini" placeholder="이 랭킹서 이름 찾기" value="${esc(curFilter)}" oninput="curFilter=this.value;curPage=0;render()" style="flex:1;min-width:140px">
    <span class="muted">${hk(curBoard)} · 전체 ${size.toLocaleString()}명${curRegion?` · ${curRegion} ${total.toLocaleString()}명`:''}</span></div>`;
  h+='<div class="card" style="overflow-x:auto"><table><thead><tr><th class="rank">순위</th><th>닉네임</th><th class="num">점수</th><th class="num">승률</th><th class="num">레벨</th><th class="num">MVP</th></tr></thead><tbody>';
  if(!slice.length) h+='<tr><td colspan="6" class="empty">결과 없음</td></tr>';
  for(const r of slice){const p=P[r.id];const sc=(p.rk[curBoard]||[])[1];
    h+=`<tr onclick="goPlayer('${r.id}')"><td class="rank ${medalCls(r.rank)}">${r.rank}</td>
      <td><span class="name">${esc(p.n)}</span><span class="reg">${esc(p.r)}</span></td>
      <td class="num">${sc!=null?sc.toLocaleString():'-'}</td>
      <td class="num wr ${wrClass(p.wr)}">${p.wr!=null?p.wr+'%':'-'}</td>
      <td class="num">${p.lv??'-'}</td><td class="num">${p.mvp!=null?p.mvp.toLocaleString():'-'}</td></tr>`;
  }
  h+='</tbody></table>';
  h+=`<div class="pager"><button onclick="curPage=0;render()" ${curPage===0?'disabled':''}>«</button>
    <button onclick="curPage--;render()" ${curPage===0?'disabled':''}>이전</button>
    <span>${curPage+1} / ${pages}</span>
    <button onclick="curPage++;render()" ${curPage>=pages-1?'disabled':''}>다음</button>
    <button onclick="curPage=${pages-1};render()" ${curPage>=pages-1?'disabled':''}>»</button></div></div>`;
  app.innerHTML=h;
}

function renderPlayer(id){
  const p=P[id];
  if(!p){
    if(window.LIVE){ app.innerHTML='<div class="card"><div class="empty">불러오는 중…</div></div>';
      fetch('/api/player/'+encodeURIComponent(id)).then(r=>r.json()).then(j=>{ if(j.ok&&j.player){P[id]=j.player; if(location.hash==='#/player/'+id) renderPlayer(id);} else app.innerHTML='<div class="card"><div class="empty">유저 없음</div></div>'; }).catch(()=>{app.innerHTML='<div class="card"><div class="empty">불러오기 실패</div></div>';});
      return;
    }
    app.innerHTML='<div class="card"><div class="empty">유저 없음</div></div>'; return;
  }
  const init=(p.n.trim()[0]||'?').toUpperCase();
  let h=`<a class="back" onclick="history.back()">← 뒤로</a>`;
  const liveBtn=window.LIVE?`<button class="btn" id="refreshBtn" onclick="refreshPlayer('${id}')" style="margin-left:auto">${ICON.refresh} 실시간 새로고침</button>`:'';
  h+=`<div class="card"><div class="pf-top">
    <div class="pf-av">${esc(init)}</div>
    <div><div class="pf-name">${esc(p.n)}</div>
    <div class="muted">${esc(p.r)} · 레벨 ${p.lv??'-'} · <span class="mono">${id.slice(0,8)}…</span></div>
    ${p.prev&&p.prev.length?`<div style="font-size:12px;margin-top:4px"><span class="muted">이전 닉네임 </span>${p.prev.map(pn=>`<span style="display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 0 0;color:var(--acc2);font-weight:600">${esc(pn)}</span>`).join('')}</div>`:''}
    <div class="muted" id="freshInfo" style="font-size:11px"></div></div>
    ${liveBtn}</div>`;
  const fmt=n=>n!=null?n.toLocaleString():'-';
  h+=`<div class="stat-grid">
    <div class="stat"><div class="k">승률</div><div class="v ${wrClass(p.wr)}">${p.wr!=null?p.wr+'%':'-'}</div></div>
    <div class="stat"><div class="k">KD</div><div class="v">${p.kd??'-'}</div></div>
    <div class="stat"><div class="k">킬 / 데스</div><div class="v" style="font-size:16px">${fmt(p.k)} / ${fmt(p.d)}</div></div>
    <div class="stat"><div class="k">플레이 매치</div><div class="v">${fmt(p.m)}</div></div>
    <div class="stat"><div class="k">승리</div><div class="v">${fmt(p.w)}</div></div>
    <div class="stat"><div class="k">MVP</div><div class="v">${fmt(p.mvp)}</div></div>
    <div class="stat"><div class="k">플레이시간</div><div class="v">${p.pt!=null?p.pt+'시':'-'}</div></div>
    <div class="stat"><div class="k">총 데미지</div><div class="v" style="font-size:16px">${fmt(p.dmg)}</div></div>
  </div></div>`;
  // 랭킹 (모드 + 캐릭터)
  const rk=p.rk||{};
  const modeRows=['프로','캐주얼'].filter(m=>rk[m]);
  const heroRows=D.hero_labels.filter(hl=>rk[hl]).sort((a,b)=>rk[a][0]-rk[b][0]);
  h+=`<div class="sect-t">${ICON.trophy} 랭킹 (시즌 ${D.season.slice(0,4)}-${D.season.slice(4)})</div><div class="card" style="overflow-x:auto"><table>
    <thead><tr><th>구분</th><th class="num">순위</th><th class="num">점수</th><th class="hcol">상위 %</th></tr></thead><tbody>`;
  const addRow=(lab,isHero)=>{const [rank,score]=rk[lab];const size=BM[lab]?.size||rank;const pct=Math.max(0.1,(rank/size*100));
    h+=`<tr><td>${isHero?ICON.target+' ':''}${isHero?hk(lab):lab}</td><td class="num rank ${medalCls(rank)}" style="text-align:right">${rank.toLocaleString()}</td>
      <td class="num">${score.toLocaleString()}</td>
      <td class="hcol"><span class="pct"><i style="width:${Math.min(100,pct)}%"></i></span> <span class="muted">${pct.toFixed(1)}%</span></td></tr>`;};
  if(!modeRows.length&&!heroRows.length) h+='<tr><td colspan="4" class="empty">랭킹 기록 없음</td></tr>';
  modeRows.forEach(m=>addRow(m,false));
  heroRows.forEach(hl=>addRow(hl,true));
  h+='</tbody></table></div>';
  // 캐릭터별 상세 (레벨·플레이시간·레이팅·스킨)
  const H=p.h||{};
  const hero_list=Object.keys(H).filter(hn=>H[hn].lv!=null)
    .sort((a,b)=>(H[b].pt||0)-(H[a].pt||0));
  if(hero_list.length){
    h+='<div class="sect-t">'+ICON.target+' 캐릭터별 상세 (플레이시간 순)</div><div class="card">';
    for(const hn of hero_list){const hd=H[hn];const seasonRank=rk[hn]?rk[hn][0].toLocaleString()+'위':null;
      h+=`<div class="hrow">
        <div><span class="hn">${heroImg(hn,'hi-lg')}${hk(hn)}</span><span class="lv">Lv.${hd.lv??'-'}</span></div>
        <div class="hm"><span>⏱ ${hd.pt!=null?hd.pt+'시':'-'}</span><span>레이팅 <b>${hd.rt!=null?hd.rt.toLocaleString():'-'}</b></span>${seasonRank?`<span>시즌 ${seasonRank}</span>`:''}${hd.sk?`<span>🎨 ${esc(hd.sk)}</span>`:''}</div>
        ${(hd.pk&&hd.pk.length)?`<div class="pk"><span class="pkl">특성</span>${perkChips(hd.pk)}</div>`:''}
      </div>`;
    }
    h+='</div>';
  }
  // 최근 경기
  h+='<div class="sect-t">'+ICON.history+' 최근 경기 <span id="matchInfo" class="muted" style="font-size:12px;font-weight:400"></span></div><div id="matchBox">';
  if(p.matches&&p.matches.length){ h+=matchesHtml(p.matches); }
  else if(window.LIVE){ h+='<div class="card"><div class="empty">위 <b>실시간 새로고침</b> 버튼을 누르면 최근 경기가 표시됩니다</div></div>'; }
  else { h+='<div class="card"><div class="empty">최근 경기는 실시간 서버(서버 실행 시)에서만 조회됩니다</div></div>'; }
  h+='</div>';
  app.innerHTML=h; window.scrollTo(0,0);
  // 실시간 모드면 경기 자동 로드 (한 번만)
  if(window.LIVE && !p.matches && !p._tried){ p._tried=true; refreshPlayer(id); }
}

function matchesHtml(matches){
  const typeName=t=>t===1?'프로':t===2?'캐주얼':'-';
  const ago=ts=>{if(!ts)return'';const s=Math.floor(Date.now()/1000-ts);if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';return Math.floor(s/86400)+'일 전';};
  const dur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'';
  const num=n=>n!=null?n.toLocaleString():'-';
  if(!matches||!matches.length) return '<div class="card"><div class="empty">경기 기록 없음</div></div>';
  let h='<div class="card" style="overflow-x:auto"><table class="mtab"><thead><tr>'
    +'<th>결과</th><th>캐릭터</th><th>맵 · 모드</th><th class="num">K / D</th><th class="num hcol">데미지</th><th class="num hcol">레이팅</th><th>시간</th></tr></thead><tbody>';
  matches.forEach((m,i)=>{
    const cls=m.win?'win':'loss';
    const rb=`<span class="rb ${cls}">${m.win?'승':'패'}</span>`;
    const mvp=m.mvpme?'<span class="mvpb">MVP</span>':'';
    h+=`<tr class="mrow ${cls}" onclick="toggleMatch(${i})">
      <td><div style="display:flex;align-items:center;gap:5px">${rb}${mvp}<span class="muted" style="font-variant-numeric:tabular-nums">${m.mys}-${m.ens}</span></div></td>
      <td class="hcell">${heroImg(m.myhero)}${esc(hk(m.myhero))}</td>
      <td>${esc(m.map)||'-'} <span class="muted hcol">· ${typeName(m.type)} · ${dur(m.dur)}</span></td>
      <td class="num">${m.myk??'-'} / ${m.myd??'-'}</td>
      <td class="num hcol">${num(m.dmg)}</td>
      <td class="num hcol">${num(m.myrt)}</td>
      <td class="muted">${ago(m.ts)}</td></tr>`;
    const perksOf=x=>(x.hp&&x.hp.length)?x.hp.map(g=>`<div class="sbp">${x.hp.length>1?`<span class="hh">${esc(hk(g.h))}</span>`:''}${perkChips(g.pk,1)}</div>`).join(''):'';
    const side=arr=>arr.map(x=>`<div style="${x.me?'font-weight:800;color:var(--acc2)':''}">${x.mv?'👑 ':''}${heroImg(x.h)}${esc(hk(x.h))} · ${x.id?`<span class="plink" onclick="event.stopPropagation();goPlayer('${x.id}')">${esc(x.n)}</span>`:esc(x.n)} <span class="muted">${x.k??0}/${x.d??0}</span></div>${perksOf(x)}`).join('');
    const meP=m.players.find(x=>x.me); const myTeam=meP?meP.tm:1;
    const t1=m.players.filter(x=>x.tm===myTeam),t2=m.players.filter(x=>x.tm!==myTeam);
    h+=`<tr class="mdet" id="md${i}" style="display:none"><td colspan="8">
      <div style="display:flex;gap:24px;flex-wrap:wrap;padding:4px 2px;font-size:12px">
        <div style="flex:1;min-width:150px"><div style="font-size:11px;margin-bottom:4px"><span class="muted">우리 팀 · </span><b style="color:${m.win?'var(--win)':'var(--lose)'}">${m.mys}</b></div>${side(t1)}</div>
        <div style="flex:1;min-width:150px"><div style="font-size:11px;margin-bottom:4px"><span class="muted">상대 팀 · </span><b>${m.ens}</b></div>${side(t2)}</div>
      </div></td></tr>`;
  });
  return h+'</tbody></table></div>';
}
window.toggleMatch=i=>{const el=document.getElementById('md'+i);if(el)el.style.display=el.style.display==='none'?'':'none';};
function searchRow(it){
  let best='',bestRank=1e9; const rk=it.rk||{};
  for(const lab in rk){if(rk[lab][0]<bestRank){bestRank=rk[lab][0];best=hk(lab)+' '+rk[lab][0]+'위';}}
  const prevTag=it.prevMatch?`<div class="muted" style="font-size:11px">↳ 옛 닉네임 <b>${esc(it.prevMatch)}</b> → 지금 <b>${esc(it.n)}</b></div>`:'';
  return `<tr onclick="goPlayer('${it.id}')"><td><span class="name">${esc(it.n)}</span>${prevTag}</td><td class="muted">${esc(it.r||'')}</td>`
    +`<td class="num wr ${wrClass(it.wr)}">${it.wr!=null?it.wr+'%':'-'}</td><td class="num">${it.lv??'-'}</td><td class="muted">${best||'-'}</td></tr>`;
}
function renderSearchResults(q,items){
  const f=q.toLowerCase();
  items.sort((a,b)=>{const rk=x=>{const n=(x.n||'').toLowerCase();return n===f?0:n.startsWith(f)?1:(x.prevMatch?3:2);};return rk(a)-rk(b);});
  let h=`<a class="back" onclick="goBoard('프로')">← 랭킹으로</a><div class="sect-t">'${esc(q)}' 검색결과 ${items.length}명${items.length>=300?'+ (상위 300)':''}</div>`;
  h+='<div class="card" style="overflow-x:auto"><table><thead><tr><th>닉네임</th><th>지역</th><th class="num">승률</th><th class="num">레벨</th><th>최고 랭킹</th></tr></thead><tbody>';
  if(!items.length) h+='<tr><td colspan="5" class="empty">결과 없음</td></tr>';
  for(const it of items) h+=searchRow(it);
  h+='</tbody></table></div>'; app.innerHTML=h;
}
function clientSearch(q){
  const f=q.toLowerCase(); const byId={};
  for(const [nm,id,prevName] of NAMEIDX){ if(!nm.includes(f))continue; if(!byId[id])byId[id]={id,prevMatch:null}; if(prevName)byId[id].prevMatch=prevName; }
  return Object.values(byId).slice(0,300).map(o=>{const p=P[o.id]||{};return {id:o.id,n:p.n,r:p.r,wr:p.wr,lv:p.lv,prevMatch:o.prevMatch,rk:p.rk};});
}
function renderSearch(q){
  if(window.LIVE){   // 서버 실시간 검색 (개명 즉시 반영, 현재 닉네임으로 표시)
    app.innerHTML=`<a class="back" onclick="goBoard('프로')">← 랭킹으로</a><div class="sect-t">'${esc(q)}' 검색 중…</div>`;
    fetch('/api/search?q='+encodeURIComponent(q)).then(r=>r.json())
      .then(j=>renderSearchResults(q,(j.results||[]).map(r=>({id:r.id,n:r.n,r:r.r,wr:r.wr,lv:r.lv,prevMatch:r.pm,rk:r.rk}))))
      .catch(()=>renderSearchResults(q,clientSearch(q)));
    return;
  }
  renderSearchResults(q,clientSearch(q));
}

// 라우팅
function goBoard(b){if(!b)return;curBoard=b;curPage=0;curFilter='';location.hash='#/board/'+encodeURIComponent(b);}
function goPlayer(id){location.hash='#/player/'+id;}
function doSearch(){const q=document.getElementById('q').value.trim();if(q)location.hash='#/search/'+encodeURIComponent(q);}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

function render(){
  hidePerkTip();
  const h=decodeURIComponent(location.hash||'');
  if(h.startsWith('#/player/')) return renderPlayer(h.slice(9));
  if(h.startsWith('#/search/')) return renderSearch(h.slice(9));
  if(h.startsWith('#/board/')){curBoard=h.slice(8)||'프로';}
  renderBoard();
}
window.addEventListener('hashchange',render);

// 실시간 새로고침 (백엔드 서버가 있을 때만)
window.LIVE=false;
async function refreshPlayer(id){
  const btn=document.getElementById('refreshBtn'); if(btn){btn.disabled=true;btn.textContent='조회중…';}
  try{
    const r=await fetch('/api/player/'+id); const j=await r.json();
    if(j.ok&&j.player){ P[id]=Object.assign(P[id]||{},j.player); renderPlayer(id);
      const fi=document.getElementById('freshInfo'); if(fi) fi.textContent='방금 실시간 갱신됨 ✓';
    } else { if(btn){btn.disabled=false;btn.innerHTML=ICON.refresh+' 실시간 새로고침';} alert('조회 실패'); }
  }catch(e){ if(btn){btn.disabled=false;btn.innerHTML=ICON.refresh+' 실시간 새로고침';} alert('서버 연결 실패: '+e); }
}
function timeAgo(ts){if(!ts)return'';const s=Math.floor(Date.now()/1000-ts);if(s<60)return s+'초 전';if(s<3600)return Math.floor(s/60)+'분 전';return Math.floor(s/3600)+'시간 전';}
fetch('/api/status').then(r=>r.json()).then(st=>{
  if(st&&st.live){ window.LIVE=true;
    const b=document.getElementById('seasonBadge');
    if(st.last_refresh) b.title='리더보드 갱신: '+timeAgo(st.last_refresh);
    if(location.hash.startsWith('#/player/')) render(); // 버튼 노출 위해 재렌더
  }
}).catch(()=>{});

if(!location.hash) location.hash='#/board/프로'; else render();
</script>
