<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricochet Squad 전적검색 · RS.GG</title>
<meta name="description" content="Ricochet Squad 랭킹·전적검색. 캐릭터 티어·상성·특성 빌드·3인/2인 조합 승률까지. 닉네임으로 전적을 찾아보세요.">
<meta name="theme-color" content="#0e1015">
<!-- 카톡·디스코드·트위터 공유 시 미리보기 카드. 없으면 링크만 덩그러니 뜬다 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="RS.GG">
<meta property="og:title" content="Ricochet Squad 전적검색 · RS.GG">
<meta property="og:description" content="랭킹·티어·상성·특성 빌드·조합 승률을 한 곳에서. 닉네임으로 전적 검색.">
<meta property="og:url" content="__SITE_URL__/">
<meta property="og:image" content="__SITE_URL__/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/hero/leo.png">
<style>
:root{
  --bg:#0e1015; --panel:#171a21; --panel2:#1e2230; --line:#2a2f3d; --tx:#e8eaf0; --mut:#9aa3b2;
  --acc:#4a86ff; --acc2:#7db1ff; --gold:#e8b923; --silver:#a9b6c6; --bronze:#cd8248;
  --win:#3fb27f; --lose:#e06c75;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f2f4f8;--panel:#fff;--panel2:#f7f9fc;--line:#e2e6ee;--tx:#1a1e27;--mut:#69707e;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px}
a{color:inherit;text-decoration:none;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hd{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
.logo span{background:linear-gradient(90deg,var(--acc),#8f6bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo .emb{width:28px;height:28px;flex:none;filter:drop-shadow(0 2px 6px rgba(74,134,255,.35))}
.ic{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .ic,.tab .ic{vertical-align:-.18em}
.mammon{background:linear-gradient(90deg,#d99e12,#ffd76b 55%,#f2b829);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:1px}
.owner{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.owner svg{width:14px;height:14px;fill:none;stroke:#e8b923;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
footer .crown{width:15px;height:15px;fill:none;stroke:#e8b923;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;vertical-align:-2px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--mut)}
select.badge{cursor:pointer;font-family:inherit}
select.badge:hover{border-color:var(--acc);color:var(--tx)}
.search{flex:1;min-width:200px;display:flex;gap:8px}
.search input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:9px 12px;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}
.tab{padding:7px 13px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-weight:600;font-size:13px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab.hero.on{background:#6b4bd6;border-color:#6b4bd6}
.row-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
/* ⚠️ 입력요소 폰트는 16px 미만이면 iOS Safari가 포커스 시 화면을 확대하고 안 돌아온다.
   데스크톱에선 13px이 보기 좋아서 601px 이상에서만 줄인다. */
select,.mini{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 10px;font-size:16px}
@media(min-width:601px){select,.mini{font-size:13px} .search input{font-size:14px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:12px;font-weight:600;background:var(--panel2)}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{font-weight:800;width:52px;text-align:center}
.r1{color:var(--gold)}.r2{color:var(--silver)}.r3{color:var(--bronze)}
/* 순위 변동(오늘 0시 기준 대비). 열을 늘리면 모바일에서 표가 터져서 순위 칸 아래에 붙인다 */
.dlt{display:block;font-size:10.5px;font-weight:700;line-height:1.1;margin-top:2px}
.dlt.up{color:var(--win)}.dlt.dn{color:var(--lose)}.dlt.new{color:var(--acc)}
.movers{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.mv{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;max-width:100%}
.mv:hover{border-color:var(--acc)}
.mv b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.mv i{font-style:normal;font-weight:800;color:var(--win)}
.warn{color:var(--lose)}                       /* 표본 얕음 경고 */
.per{font-size:10.5px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;vertical-align:middle}
/* 특성 슬롯 비교: 슬롯 4개 × 선택지 2개 */
.slotrow{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slotrow:last-child{border-bottom:0}
.slotrow>.sl{flex:0 0 62px;font-size:11.5px;font-weight:700;color:var(--mut);padding-top:6px}
.slotrow>.opts{flex:1 1 200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;min-width:0}
.opt{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:7px 9px;min-width:0}
.opt.best{border-color:var(--win)}
.opt img{width:24px;height:24px;flex:none}
/* 이름을 윗줄, 수치를 아랫줄로. 같은 줄에 두면 긴 번역(프랑스어 등)에서 이름이 40px까지 눌린다 */
.opt .oc{flex:1 1 auto;min-width:0}
.opt .on{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 승률·픽률 둘 다 %라서 라벨이 없으면 뭐가 뭔지 구분이 안 된다 */
.opt .ov{font-size:11px;color:var(--mut);margin-top:2px;display:flex;align-items:baseline;gap:3px;flex-wrap:wrap}
.opt .ov i{font-style:normal;font-size:10px;font-weight:600;opacity:.85}
.opt .ov b{font-size:13.5px;margin-right:7px}
.bld{display:flex;gap:3px;align-items:center}
.card>.row-filter{padding:12px 12px 0;margin-bottom:12px}   /* 카드 안에 들어간 선택줄 */
.name{font-weight:700}
.reg{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:2px}
.wr{font-weight:700}.wrh{color:var(--win)}.wrl{color:var(--lose)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px}
.pager button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.muted{color:var(--mut)}
/* profile */
.pf-top{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap}
@media(max-width:600px){.pf-top{gap:12px;padding:16px} .pf-top>.btn{width:100%;margin-left:0!important;justify-content:center}}
.pf-av{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--acc),#6b4bd6);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;overflow:hidden;flex:0 0 auto;position:relative}
.pf-av img{width:100%;height:100%;object-fit:cover;object-position:center top}
.pf-av .mh{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;font-weight:700;text-align:center;padding:1px 0;letter-spacing:.2px}
.pf-name{font-size:24px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:0 16px 16px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .k{font-size:12px;color:var(--mut)}
.stat .v{font-size:20px;font-weight:800;margin-top:3px}
.rnchip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;color:var(--acc2);font-weight:600}
.sect-t{font-weight:800;font-size:15px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect-t>.ic{flex:none}
#matchInfo{flex:1 1 auto;min-width:0}
.sect-t .ic{color:var(--acc)}
.pct{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px;display:inline-block;vertical-align:middle;width:90px}
.pct>i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;margin:3px;font-size:12px}
.back{display:inline-block;margin:14px 0;color:var(--acc);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* 최근 경기 테이블 */
.mtab{width:100%;border-collapse:collapse;font-size:13px;min-width:660px}
.mtab th{color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.4px;padding:10px 12px;text-align:left;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
.mtab td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtab th.num,.mtab td.num{text-align:right;font-variant-numeric:tabular-nums}
.mrow{cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.mrow.win{border-left-color:var(--win)} .mrow.loss{border-left-color:var(--lose)}
.mrow:hover{background:var(--panel2)}
.rb{display:inline-block;font-weight:800;border-radius:5px;padding:2px 9px;font-size:12px;color:#fff}
.rb.win{background:var(--win)} .rb.loss{background:var(--lose)}
.mcode{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:700;letter-spacing:.3px;color:var(--acc2);background:rgba(99,102,241,.10);border:1px solid rgba(99,102,241,.35);border-radius:5px;padding:1px 6px;cursor:pointer;white-space:nowrap;user-select:all}
.mcode:hover{background:rgba(99,102,241,.22)} .mcode.ok{color:var(--win);border-color:var(--win)}
.mvpb{background:linear-gradient(90deg,#e0a90f,#ffd76b);color:#1a1a1a;font-weight:800;font-size:10px;border-radius:4px;padding:2px 5px}
.hcell{font-weight:700}
.mdet>td{background:var(--panel2);border-bottom:2px solid var(--line)}
.plink{color:var(--acc2);cursor:pointer;font-weight:600}
.plink:hover{text-decoration:underline}
/* 캐릭터별 상세 카드형 목록 (모바일 대응) */
.hrow{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hrow:last-child{border-bottom:none}
.hrow .hn{font-weight:700}
.hrow .lv{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px;color:var(--mut);margin-left:5px;font-weight:600}
.hrow .hm{color:var(--mut);font-size:12.5px;display:flex;gap:0 14px;align-items:center;white-space:nowrap}
.hrow .hm>span{display:inline-block}
.hrow .hm .m1{min-width:76px}
.hrow .hm .m2{min-width:110px}
.hrow .hm .m3{min-width:94px}
.hrow .hm .m4{min-width:134px}
.hrow .hm .dim{opacity:.4}
/* 좁은 화면: 이름 아래 2×2로 떨어뜨려도 칸이 고정이라 줄마다 맞음 */
@media(max-width:820px){
  .hrow .hm{flex-basis:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3px 12px}
  .hrow .hm>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
}
.hrow .hm b{color:var(--tx);font-weight:700}
.hrow .pk{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:1px}
.hrow .pk .pkl{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.3px}
.hi{width:22px;height:26px;border-radius:5px;object-fit:cover;vertical-align:middle;margin-right:5px;background:var(--panel2)}
.hi-lg{width:34px;height:40px;border-radius:7px}
.hrow>div:first-child{flex:0 0 auto;display:flex;align-items:center;white-space:nowrap}
.sbteam{flex:1 1 210px;min-width:0;max-width:560px;padding-left:9px;border-left:3px solid var(--line);border-radius:2px}
.sbteam.ally{border-left-color:var(--win)}
.sbteam.foe{border-left-color:var(--lose)}
.sbhead{font-size:11px;margin-bottom:5px;font-weight:700}
.sbl{display:flex;align-items:center;gap:8px;min-width:0}
.sbl .sbn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbl .sbmvp{flex:0 0 auto;font-size:9.5px;font-weight:800;color:#1a1a1a;background:var(--gold);border-radius:4px;padding:1px 4px;letter-spacing:.3px}
.sbl .sbparty{flex:0 0 auto;font-size:9px;font-weight:700;color:var(--acc2);border:1px solid var(--acc);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.sbl .sbbot{flex:0 0 auto;font-size:9px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.sbl .sbk{flex:0 0 auto;color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.sbl.me{font-weight:800;color:var(--acc2)}
.sbl.me .sbk{color:var(--acc2)}
.sbp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:2px 0 7px 27px}
.sbp .hh{font-size:10.5px;color:var(--mut);font-weight:700;align-self:center}
.sbst{margin-left:auto;font-size:10.5px;color:var(--mut);white-space:nowrap;padding-left:8px}
.sbst b{color:var(--tx);font-weight:700}
.pkb{width:31px;height:31px;padding:0;border:none;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.pkb img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.pkb:hover{filter:brightness(1.15) drop-shadow(0 0 4px rgba(255,255,255,.3))}
.pkb:active{transform:scale(.93)}
.pkb.sm{width:25px;height:25px}

#perkTip{position:fixed;z-index:60;display:none;max-width:min(280px,88vw);background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 10px 28px rgba(0,0,0,.4)}
/* 좁은 화면: 최근경기 덜 중요한 열 접기 */
.mmode{font-size:12px}
.mdmg{display:none}
@media(max-width:600px){.mtab{min-width:0} .hcol{display:none}
  /* 좁은 화면에선 셀 여백을 줄여야 마지막 열(승률)이 안 잘린다 */
  th,td{padding:9px 7px}
  .reg{font-size:10px;padding:1px 4px;margin-left:1px}
  .mmode{display:block;font-size:10.5px;margin-top:2px} .mtab th,.mtab td{padding:7px 6px;font-size:12px}
  .mdmg{display:block;font-size:10px;color:var(--mut);font-weight:400;margin-top:2px}
  .sect-t{font-size:14px} #matchInfo{flex:1 0 100%;margin-left:0}
  .mtab th,.mtab td{padding:6px 4px}
  .rb{padding:2px 6px;font-size:11.5px} .mvpb{font-size:9px;padding:2px 4px}}
.comp{display:flex;align-items:center;gap:3px}
.comp img{width:30px;height:36px;border-radius:6px;object-fit:cover;background:var(--panel2)}
.comp b{font-weight:700;margin-left:6px;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;width:70px}
.bar>i{display:block;height:100%;background:var(--acc)}
/* 좁은 화면: 이름을 숨기지 말고 아이콘 아래 줄로 */
@media(max-width:600px){.comp{flex-wrap:wrap}
  .comp img{width:26px;height:31px}
  .comp b{flex-basis:100%;margin-left:0;font-size:10.5px;font-weight:600;white-space:normal;line-height:1.3}}
.langsel{position:relative}
.lbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.lbtn:hover{border-color:var(--acc)}
.lbtn .cv{color:var(--mut);font-size:10px}
.lbtn .lflag{font-size:14px;line-height:1}
.lmenu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.45);min-width:236px}
.lmt{font-size:11px;color:var(--mut);font-weight:700;margin:2px 4px 8px}
.lmg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.lgi{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:7px 9px;color:var(--tx);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;white-space:nowrap}
.lgi:hover{background:var(--panel2)}
.lgi.on{border-color:var(--acc);background:var(--panel2)}
.lgi .fl{font-size:14px}
.lgi .ck{margin-left:auto;color:var(--acc);font-weight:800}
/* 좁은 화면: 언어 버튼을 첫 줄 오른쪽 끝, 검색창은 아래 줄 전체 */
@media(max-width:700px){
  .hd{gap:8px}
  .logo{font-size:18px;gap:7px} .logo .emb{width:24px;height:24px}
  .badge,.owner,.lbtn{font-size:11px;padding:3px 9px}
  .owner svg{width:12px;height:12px}
  .langsel{order:1;margin-left:auto} .search{order:2;width:100%;flex:1 0 100%}
}
/* 아주 좁은 화면: 언어 이름은 숨기고 국기만 (메뉴에는 이름이 다 나옴) */
@media(max-width:430px){
  .hd{gap:6px}
  .lbtn .lname{display:none} .lbtn{padding:4px 8px} .lbtn .lflag{font-size:15px}
  .owner svg{display:none} .owner{gap:4px}
  .badge,.owner{padding:3px 8px}
}
.lmenu{max-width:calc(100vw - 24px)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:24px}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="logo" href="#/board/pro" onclick="event.preventDefault();goHome()">
    <svg class="emb" viewBox="0 0 32 32" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4a86ff"/><stop offset="1" stop-color="#8f6bff"/></linearGradient></defs>
      <path d="M16 2.5 27.5 8.6v9.2c0 6.2-4.6 10.4-11.5 13.2C9.1 28.2 4.5 24 4.5 17.8V8.6L16 2.5Z"
        fill="url(#lg)" fill-opacity="0.16" stroke="url(#lg)" stroke-width="1.6"/>
      <circle cx="16" cy="15" r="5.4" stroke="url(#lg)" stroke-width="1.6"/>
      <circle cx="16" cy="15" r="1.7" fill="url(#lg)"/>
      <path d="M16 6.3v3.3M16 20.4v3.3M6.9 15h3.3M21.8 15h3.3" stroke="url(#lg)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    RS<span>.GG</span></a>
  <select class="badge" id="seasonSel" onchange="setSeason(this.value)"></select>
  <span class="owner">
    <svg viewBox="0 0 24 24"><path d="M4 9l4 3 4-6 4 6 4-3-1.5 10H5.5L4 9Z"/><path d="M5.5 19h13"/></svg>
    by <span class="mammon">MAMMON</span></span>
  <div class="search">
    <input id="q" autocomplete="off">
    <button class="btn" onclick="doSearch()">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg> <span id="searchLbl"></span></button>
  </div>
  <div class="langsel">
    <button class="lbtn" id="langBtn" onclick="toggleLangMenu(event)"><span class="lflag" id="langFlag"></span><span class="lname" id="langLbl"></span><span class="cv">▾</span></button>
    <div class="lmenu" id="langMenu" onclick="event.stopPropagation()">
      <div class="lmt" id="langTitle"></div>
      <div class="lmg" id="langGrid"></div>
    </div>
  </div>
</div></header>

<div class="wrap" id="app"></div>
<footer>
  <div style="margin-bottom:6px">
    <svg class="crown" viewBox="0 0 24 24"><path d="M4 9l4 3 4-6 4 6 4-3-1.5 10H5.5L4 9Z"/><path d="M5.5 19h13"/></svg>
    Created &amp; owned by <span class="mammon" style="font-size:14px">MAMMON</span>
  </div>
  <span id="footerTxt"></span> · © 2026 MAMMON. All rights reserved.
</footer>

<div id="perkTip"></div>
<script src="i18n.js"></script>
<script src="site_data.js"></script>
<script>
const D=window.DATA, P=D.players;
// 시즌 여러 개를 담고 있고, 고른 시즌의 보드만 꺼내 쓴다
const SEASONS=(D.seasons&&D.seasons.length)?D.seasons:['?'];
function pickSeason(){
  try{const v=localStorage.getItem('rsgg_season'); if(v&&SEASONS.includes(v)) return v;}catch(e){}
  return SEASONS[0];
}
let curSeason=pickSeason();
const SD=()=>(D.sdata&&D.sdata[curSeason])||{boards:{},board_meta:{},board_labels:[],hero_labels:[]};
let B=SD().boards, BM=SD().board_meta;
function seasonLabel(c){return c&&c.length===6?c.slice(0,4)+'-'+c.slice(4):c;}
window.setSeason=v=>{
  if(!SEASONS.includes(v))return;
  curSeason=v; B=SD().boards; BM=SD().board_meta;
  try{localStorage.setItem('rsgg_season',v);}catch(e){}
  // 고른 시즌에 없는 보드를 보고 있었으면 프로/캐주얼로 되돌린다
  if(!SEASONLESS.includes(curBoard) && !B[curBoard]){
    curBoard = B['pro']?'pro':'casual';
    location.hash='#/board/'+encodeURIComponent(curBoard);   // 해시도 맞춰야 render()가 안 되돌린다
  }
  curPage=0; applyStatic(); render();
};
const PMETA=D.perk_meta||{};

// ── 다국어 ────────────────────────────────────────────
// 게임 안 이름(캐릭터·맵·특성)은 게임 공식 번역, UI 문구는 i18n.js 표에서 가져온다.
const I18N=window.I18N||{};
const LANG_ORDER=['ko','en','ja','zh-TW','fr','de','es','pt','ru'];
function detectLang(){
  try{const saved=localStorage.getItem('rsgg_lang'); if(saved&&I18N[saved]) return saved;}catch(e){}
  const cands=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
  for(const raw of cands){
    const l=String(raw||'').toLowerCase();
    if(l.startsWith('ko'))return 'ko';   if(l.startsWith('ja'))return 'ja';
    if(l.startsWith('zh'))return 'zh-TW';if(l.startsWith('fr'))return 'fr';
    if(l.startsWith('de'))return 'de';   if(l.startsWith('es'))return 'es';
    if(l.startsWith('pt'))return 'pt';   if(l.startsWith('ru'))return 'ru';
    if(l.startsWith('en'))return 'en';
  }
  return I18N.en?'en':'ko';
}
const EMPTY={ui:{},heroes:{},maps:{},perks:{},regions:{},label:'',flag:''};
let LANG=detectLang(), L=I18N[LANG]||I18N.en||EMPTY;
// ⚠️ 자리표시자는 **한 번에** 바꾼다. 순서대로 바꾸면 먼저 넣은 값 안의 {n}이 다시 치환된다.
//    (검색어로 "{n}"을 넣으면 제목이 "'0' 검색결과"로 나오던 버그)
function t(k,v){let s=(L.ui&&L.ui[k]!=null)?L.ui[k]:k;
  if(v) s=String(s).replace(/\{(\w+)\}/g,(m,n)=>(n in v)?v[n]:m);
  return s;}
const mapName=id=>(L.maps&&L.maps[String(id)])||'';
const perkName=id=>(L.perks&&L.perks[String(id)])||('#'+id);
const regionName=c=>(L.regions&&L.regions[c])||c||'';
const boardLabel=b=>b==='pro'?t('tab_pro'):b==='casual'?t('tab_casual'):hk(b);
window.setLang=function(l){ if(!I18N[l])return; LANG=l; L=I18N[l];
  try{localStorage.setItem('rsgg_lang',l);}catch(e){}
  applyStatic(); render(); closeLangMenu(); };
window.toggleLangMenu=function(e){e.stopPropagation();const m=document.getElementById('langMenu');
  m.style.display=(m.style.display==='block')?'none':'block';};
function closeLangMenu(){const m=document.getElementById('langMenu'); if(m)m.style.display='none';}
document.addEventListener('click',closeLangMenu);
function applyStatic(){
  document.documentElement.lang=LANG;
  document.title=t('site_title');
  const sel=document.getElementById('seasonSel');
  sel.innerHTML=SEASONS.map(c=>`<option value="${c}" ${c===curSeason?'selected':''}>${t('season')} ${seasonLabel(c)}</option>`).join('');
  syncSeasonSel();
  document.getElementById('q').placeholder=t('search_ph');
  document.getElementById('searchLbl').textContent=t('search');
  document.getElementById('footerTxt').textContent=t('footer',{n:D.generated_count.toLocaleString()});
  document.getElementById('langFlag').textContent=L.flag||'';
  document.getElementById('langLbl').textContent=L.label||LANG;
  document.getElementById('langTitle').textContent=t('lang_title');
  document.getElementById('langGrid').innerHTML=LANG_ORDER.filter(c=>I18N[c]).map(c=>
    `<button type="button" class="lgi${c===LANG?' on':''}" onclick="setLang('${c}')"><span class="fl">${I18N[c].flag}</span>${I18N[c].label}${c===LANG?'<span class="ck">✓</span>':''}</button>`).join('');
}

// 이름 검색 인덱스
const NAMEIDX=[];
for(const id in P){
  NAMEIDX.push([P[id].n.toLowerCase(), id, null]);           // 현재 닉네임
  (P[id].prev||[]).forEach(pn=>{ if(pn) NAMEIDX.push([pn.toLowerCase(), id, pn]); });  // 이전 닉네임
}

const app=document.getElementById('app');
const ICON={
  trophy:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22"/><path d="M14 14.7V17c0 .6.5 1 1 1.2C16.1 18.8 17 20.2 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
  target:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>',
  history:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>',
  refresh:'<svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v4h-4"/></svg>',
};
const hk=n=>(L.heroes&&L.heroes[n])||n;  // 캐릭명만 번역 (닉네임 등은 원본 유지)
const esc=s=>(s||'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;","`":"&#96;"}[c]));
const wrClass=w=>w==null?'':(w>=50?'wrh':'wrl');
function heroImg(n,cls){const f=String(n||'').toLowerCase();if(!f||f[0]==='#')return '';
  return `<img class="hi ${cls||''}" src="img/hero/${f}.png" alt="" loading="lazy" onerror="this.style.display='none'">`;}
// 퍽 = 게임의 육각 배지. 분류(type 0~8)가 곧 배지 그림
function perkChips(arr,sm){return (arr||[]).map(p=>{
  let nm,ty;
  if(Array.isArray(p)){ nm=p[0]; ty=(p[1]>=0&&p[1]<=8)?p[1]:0; }        // 옛 형식([이름,분류,아이콘])
  else { const m=PMETA[String(p)]||[]; nm=perkName(p); ty=(m[0]>=0&&m[0]<=8)?m[0]:0; }
  return `<button type="button" class="pkb${sm?' sm':''}" data-t="${esc(nm)}" title="${esc(nm)}" onclick="showPerk(event,this)"><img src="img/perk/${ty}.png" alt=""></button>`;
}).join('');}
window.showPerk=(ev,el)=>{ev.stopPropagation();const tip=document.getElementById('perkTip');
  if(tip.style.display==='block'&&tip._el===el){tip.style.display='none';return;}
  tip.textContent=el.dataset.t||''; tip._el=el; tip.style.display='block'; tip.style.left='0px'; tip.style.top='0px';
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let l=Math.max(8,Math.min(r.left+r.width/2-w/2, innerWidth-w-8));
  let t=r.top-h-8; if(t<8) t=r.bottom+8;
  tip.style.left=l+'px'; tip.style.top=t+'px';};
const hidePerkTip=()=>{const t=document.getElementById('perkTip'); if(t)t.style.display='none';};
document.addEventListener('click',hidePerkTip);
window.addEventListener('scroll',hidePerkTip,true);
function medalCls(r){return r===1?'r1':r===2?'r2':r===3?'r3':''}

let curBoard='pro', curPage=0, curRegion='', curFilter='';
const PAGE=100;

function tabsHtml(){
  let modes=['pro','casual'].filter(m=>B[m]);
  let h='<div class="tabs">';
  for(const m of modes) h+=`<div class="tab ${curBoard===m?'on':''}" onclick="goBoard('${m}')">${boardLabel(m)}</div>`;
  if(hasTiers()) h+=`<div class="tab ${curBoard==='tiers'?'on':''}" onclick="goBoard('tiers')">${t('tab_tiers')}</div>`;
  if(hasComps()) h+=`<div class="tab ${curBoard==='comps'?'on':''}" onclick="goBoard('comps')">${t('tab_comps')}</div>`;
  h+=`<div class="tab ${curBoard==='renamed'?'on':''}" onclick="goBoard('renamed')">${t('tab_renamed')}</div>`;
  h+=`<select class="tab hero ${SD().hero_labels.includes(curBoard)?'on':''}" onchange="goBoard(this.value)" style="min-width:120px">`;
  h+=`<option value="">${t('tab_hero')}▾</option>`;
  for(const hl of SD().hero_labels) h+=`<option value="${hl}" ${curBoard===hl?'selected':''}>${hk(hl)}</option>`;
  h+='</select></div>';
  return h;
}

// 지역 선택. 예전엔 onchange에서 render()로 화면을 통째로 다시 그렸는데, 그러면 선택하는
// 순간 select 자신이 지워졌다 새로 생긴다. 그 사이에 브라우저(특히 모바일 피커)가 선택을
// 흘려버려서 "한 번 골라도 바로 안 바뀌는" 증상이 났다. 이제 select는 그대로 두고 목록만 바꾼다.
// input/change를 둘 다 받는 건 기기에 따라 한쪽만 오는 경우가 있어서다(중복은 값 비교로 걸러짐).
function regionOptions(){
  const set=new Set(); for(const id in P) if(P[id].r) set.add(P[id].r);
  let h=`<select oninput="onRegionChange(this)" onchange="onRegionChange(this)"><option value="">${t('all_regions')}</option>`;
  for(const r of [...set].sort()) h+=`<option value="${r}" ${curRegion===r?'selected':''}>${regionName(r)}</option>`;
  return h+'</select>';
}
window.onRegionChange=el=>{
  if(curRegion===el.value) return;
  curRegion=el.value; curPage=0;
  const body=document.getElementById('boardBody');
  if(!body){ render(); return; }
  body.innerHTML=boardBodyHtml();
  const cnt=document.getElementById('boardCount');
  if(cnt) cnt.innerHTML=boardCountHtml();
};

// 티어·조합·특성 통계는 heroes.json / comps.json / perks.json에서 오는데
// **시즌 구분이 없다**(전체 수집 기간 집계). 그런데 헤더의 시즌 선택기는 계속 보여서
// "시즌을 바꿨는데 숫자가 그대로"라는 오해를 산다. 그 탭에선 선택기를 잠근다.
const SEASONLESS=['tiers','comps','renamed'];
function syncSeasonSel(){
  const sel=document.getElementById('seasonSel'); if(!sel) return;
  const off=SEASONLESS.includes(curBoard);
  sel.disabled=off; sel.style.opacity=off?.45:''; sel.style.cursor=off?'not-allowed':'';
  sel.title=off?t('season_na'):'';
}

// ── 티어: 캐릭터 승률 · 상성 · 2인 듀오 ───────────────────────────
// heroes.json(build_heroes.py가 미리 집계)을 그대로 그린다. 갈래는 조합 탭과 동일하게
// 프로/캐주얼 × 사람만/봇포함 4가지. 봇전과 대인전은 순위가 아예 뒤집히므로 꼭 나눠 본다.
let tierMode='casual', tierBots='human', tierHero='';
function hasTiers(){
  const S=D.hstat||{};
  return ['pro_human','pro_bot','casual_human','casual_bot'].some(k=>S[k]&&S[k].heroes&&S[k].heroes.length);
}
window.setTierMode=m=>{tierMode=m;render();};
window.setTierBots=b=>{tierBots=b;render();};
window.setTierHero=v=>{tierHero=v;render();};
// 특성(퍽) 빌드. perks.json은 캐릭터마다 슬롯 4개 × 선택지 2개를 그대로 담고 있다.
// 슬롯별로 둘 중 뭐가 나은지 나란히 보여주는 게 핵심이고, 4개 다 낀 빌드 순위는 그 아래.
const SLOT_LABEL=['slot_ab1','slot_ab2','slot_ult','slot_wep'];
function perksHtml(splitKey,hero){
  const S=(D.pstat||{})[splitKey];
  const hp=S&&S.heroes&&S.heroes[hero];
  if(!hp) return '';
  let h=`<div class="sect-t">${ICON.target} ${t('perks_title')} <span class="muted" style="font-size:12px;font-weight:400">${hk(hero)} · ${t('perks_note')} · ${t('samples',{n:hp.n.toLocaleString()})}</span></div>`;
  // 슬롯별 비교
  h+='<div class="card">';
  let drew=false;
  hp.slots.forEach((opts,i)=>{
    if(!opts||!opts.length) return;
    drew=true;
    const best=Math.max(...opts.map(o=>o[3]));
    h+=`<div class="slotrow"><div class="sl">${t(SLOT_LABEL[i])}</div><div class="opts">`;
    for(const o of opts){
      const m=PMETA[String(o[0])]||[]; const ty=(m[0]>=0&&m[0]<=8)?m[0]:0;
      h+=`<div class="opt ${o[3]===best&&opts.length>1?'best':''}">
        <img src="img/perk/${ty}.png" alt="">
        <div class="oc">
          <div class="on" title="${esc(perkName(o[0]))}">${esc(perkName(o[0]))}</div>
          <div class="ov"><i>${t('c_wr')}</i><b class="wr ${wrClass(o[3])}">${o[3]}%</b>
            <i>${t('c_pick')}</i>${o[4]}%<span class="muted"> · ${o[1].toLocaleString()}</span></div>
        </div></div>`;
    }
    h+='</div></div>';
  });
  h+='</div>';
  if(!drew) h='';
  // 4슬롯 전부 낀 빌드 순위
  const bl=(hp.builds||[]);
  if(bl.length){
    h+=`<div class="sect-t">${ICON.trophy} ${t('builds_title')} <span class="muted" style="font-size:12px;font-weight:400">${t('builds_note',{n:S.min_build})}</span></div>`;
    h+=`<div class="card" style="overflow-x:auto"><table><thead><tr><th class="rank">${t('c_rank')}</th><th>${t('c_build')}</th><th class="num">${t('c_wr')}</th><th class="num hcol">${t('c_pick')}</th><th class="num">${t('c_games')}</th></tr></thead><tbody>`;
    bl.slice(0,8).forEach((b,i)=>{
      const ids=b[0].split('-');
      h+=`<tr><td class="rank ${medalCls(i+1)}">${i+1}</td>
        <td><span class="bld">${perkChips(ids,1)}</span></td>
        <td class="num wr ${wrClass(b[3])}">${b[3]}%</td>
        <td class="num hcol muted">${b[4]}%</td>
        <td class="num">${b[1].toLocaleString()}</td></tr>`;
    });
    h+='</tbody></table></div>';
  }
  return h;
}
function renderTiers(){
  const S=D.hstat||{};
  const has=k=>S[k]&&S[k].heroes&&S[k].heroes.length;
  const key=(m,b)=>m+'_'+b;
  let h=tabsHtml();
  if(!has(key(tierMode,tierBots))){
    outer: for(const m of ['casual','pro']) for(const b of ['human','bot'])
      if(has(key(m,b))){ tierMode=m; tierBots=b; break outer; }
  }
  const d=S[key(tierMode,tierBots)];
  if(!d){ app.innerHTML=h+`<div class="card"><div class="empty">${t('comps_empty')}</div></div>`; return; }
  h+='<div class="tabs" style="margin-top:2px">';
  for(const m of ['pro','casual'])
    if(['human','bot'].some(b=>has(key(m,b))))
      h+=`<div class="tab ${tierMode===m?'on':''}" onclick="setTierMode('${m}')">${boardLabel(m)}</div>`;
  h+='</div><div class="tabs" style="margin-top:6px">';
  for(const b of ['human','bot'])
    h+=`<div class="tab ${tierBots===b?'on':''}" onclick="setTierBots('${b}')">${t(b==='human'?'comps_human':'comps_bot')}</div>`;
  h+='</div>';
  const thin=d.matches<1000?` · <span class="warn">${t('tier_thin')}</span>`:'';

  // 1) 캐릭터 승률·픽률
  h+=`<div class="sect-t">${ICON.trophy} ${t('tier_title')} <span class="per">${t('all_period')}</span> <span class="muted" style="font-size:12px;font-weight:400">${t('tier_note',{m:d.matches.toLocaleString(),f:S.from||'',t:S.to||''})}${thin}</span></div>`;
  h+=`<div class="card" style="overflow-x:auto"><table><thead><tr><th class="rank">${t('c_rank')}</th><th>${t('c_hero')}</th><th class="num">${t('c_wr')}</th><th class="num hcol">${t('c_pick')}</th><th class="num">${t('c_games')}</th></tr></thead><tbody>`;
  const maxPick=Math.max(...d.heroes.map(x=>x[4]),0.01);
  d.heroes.forEach((c,i)=>{
    h+=`<tr onclick="setTierHero('${c[0]}')" style="cursor:pointer"><td class="rank ${medalCls(i+1)}">${i+1}</td>
      <td><span class="comp">${heroImg(c[0])}<b>${hk(c[0])}</b></span></td>
      <td class="num wr ${wrClass(c[3])}">${c[3]}%</td>
      <td class="num hcol"><span class="bar"><i style="width:${Math.round(c[4]/maxPick*100)}%"></i></span> <span class="muted">${c[4]}%</span></td>
      <td class="num">${c[1].toLocaleString()}</td></tr>`;
  });
  h+='</tbody></table></div>';

  // 2) 상성 — 13×13 표는 모바일에서 못 읽는다. 기준 캐릭터 하나를 골라 상대별로 세로로 편다.
  const C=d.counters||{};
  const heroList=d.heroes.map(x=>x[0]);
  if(!C[tierHero]) tierHero=heroList.find(x=>C[x])||'';
  if(tierHero&&C[tierHero]){
    const rows=Object.entries(C[tierHero]).sort((a,b)=>b[1][1]-a[1][1]);
    h+=`<div class="sect-t">${ICON.target} ${t('counters_title')}</div>`;
    h+=`<div class="card"><div class="row-filter"><span class="muted">${t('counters_pick')}</span>
      <select onchange="setTierHero(this.value)">`;
    for(const hn of heroList) if(C[hn]) h+=`<option value="${hn}" ${tierHero===hn?'selected':''}>${hk(hn)}</option>`;
    h+=`</select><span class="comp">${heroImg(tierHero)}<b>${hk(tierHero)}</b></span></div>
      <table><thead><tr><th>${t('counters_vs')}</th><th class="num">${t('c_wr')}</th><th class="num">${t('c_games')}</th></tr></thead><tbody>`;
    for(const [op,v] of rows)
      h+=`<tr><td><span class="comp">${heroImg(op)}<b>${hk(op)}</b></span></td>
        <td class="num wr ${wrClass(v[1])}">${v[1]}%</td><td class="num">${v[0].toLocaleString()}</td></tr>`;
    h+='</tbody></table></div>';
  }

  // 2-2) 고른 캐릭터의 추천 특성 — 슬롯 4개 × 선택지 2개라 바로 비교가 된다
  h+=perksHtml(key(tierMode,tierBots),tierHero);
  // 2인 조합은 조합 탭으로 옮겼다(3인과 나란히 보는 게 맞다) — renderComps 참고
  app.innerHTML=h;
}

// 3인 조합 순위. comps.json(로컬에서 미리 집계한 것)을 그대로 표로 그린다.
// 키는 pro_human / pro_bot / casual_human / casual_bot. 봇 낀 경기가 전체의 70%를 넘어서
// 섞어 놓으면 사람 경기 성향이 묻힌다. 그래서 나눠서 보여준다.
let compMode='pro', compBots='human';
// 조합 탭 노출 여부. 옛 형식(pro/casual)과 새 형식(pro_human 등)을 둘 다 인정한다.
function hasComps(){
  const C=D.comps||{};
  return ['pro','casual','pro_human','pro_bot','casual_human','casual_bot']
    .some(k=>C[k]&&C[k].comps&&C[k].comps.length);
}
window.setCompMode=m=>{compMode=m;render();};
window.setCompBots=b=>{compBots=b;render();};
function renderComps(){
  const C=D.comps||{};
  let h=tabsHtml();
  const has=k=>C[k]&&C[k].comps&&C[k].comps.length;
  const key=(m,b)=>m+'_'+b;
  // 옛 형식(pro/casual만 있는 comps.json)도 그릴 수 있게
  const legacy=!C['pro_human']&&!C['casual_human'];
  const K=()=>legacy?compMode:key(compMode,compBots);
  const anyData=legacy?(has('pro')||has('casual'))
    :['pro','casual'].some(m=>['human','bot'].some(b=>has(key(m,b))));
  if(!anyData){ app.innerHTML=h+`<div class="card"><div class="empty">${t('comps_empty')}</div></div>`; return; }
  if(!has(K())){
    outer: for(const m of ['pro','casual']) for(const b of ['human','bot'])
      if(has(legacy?m:key(m,b))){ compMode=m; compBots=b; break outer; }
  }
  const d=C[K()]||{comps:[],matches:0};
  h+='<div class="tabs" style="margin-top:2px">';
  for(const m of ['pro','casual'])
    if(['human','bot'].some(b=>has(legacy?m:key(m,b))))
      h+=`<div class="tab ${compMode===m?'on':''}" onclick="setCompMode('${m}')">${boardLabel(m)}</div>`;
  h+='</div>';
  if(!legacy){
    h+='<div class="tabs" style="margin-top:6px">';
    for(const b of ['human','bot'])
      h+=`<div class="tab ${compBots===b?'on':''}" onclick="setCompBots('${b}')">${t(b==='human'?'comps_human':'comps_bot')}</div>`;
    h+='</div>';
  }
  const note=legacy?'':' · '+t(compBots==='human'?'comps_human_note':'comps_bot_note');
  h+=`<div class="sect-t">${ICON.trophy} ${t('comps_title')} <span class="per">${t('all_period')}</span> <span class="muted" style="font-size:12px;font-weight:400">${t('comps_note',{m:d.matches.toLocaleString(),n:d.min_games||C.min_games||20})}${note}</span></div>`;
  h+=`<div class="card" style="overflow-x:auto"><table><thead><tr><th class="rank">${t('c_rank')}</th><th>${t('c_comp')}</th><th class="num">${t('c_wr')}</th><th class="num hcol">${t('c_pick')}</th><th class="num">${t('c_games')}</th></tr></thead><tbody>`;
  if(!d.comps.length) h+=`<tr><td colspan="5" class="empty">${t('comps_empty')}</td></tr>`;
  const maxPick=Math.max(...d.comps.map(c=>c[4]),0.01);
  d.comps.forEach((c,i)=>{
    const heroes=c[0].split('+');
    h+=`<tr><td class="rank ${medalCls(i+1)}">${i+1}</td>
      <td><span class="comp">${heroes.map(x=>heroImg(x)).join('')}<b>${heroes.map(x=>hk(x)).join(' · ')}</b></span></td>
      <td class="num wr ${wrClass(c[3])}">${c[3]}%</td>
      <td class="num hcol"><span class="bar"><i style="width:${Math.round(c[4]/maxPick*100)}%"></i></span> <span class="muted">${c[4]}%</span></td>
      <td class="num">${c[1].toLocaleString()}</td></tr>`;
  });
  h+='</tbody></table></div>';
  // 2인 조합 — 3인(286가지)은 표본이 얇아지는데 2인(78가지)은 4배 두껍다. 나란히 봐야 판단이 선다.
  // 데이터는 heroes.json(hstat)에 있고 갈래 키는 조합 탭과 동일하다.
  h+=duosHtml(key(compMode,compBots));
  app.innerHTML=h;
}
function duosHtml(splitKey){
  const s=(D.hstat||{})[splitKey];
  if(!s||!s.duos||!s.duos.length) return '';
  let h=`<div class="sect-t">${ICON.trophy} ${t('duos_title')} <span class="muted" style="font-size:12px;font-weight:400">${t('duos_note',{n:s.min_duo})}</span></div>`;
  h+=`<div class="card" style="overflow-x:auto"><table><thead><tr><th class="rank">${t('c_rank')}</th><th>${t('c_comp')}</th><th class="num">${t('c_wr')}</th><th class="num hcol">${t('c_pick')}</th><th class="num">${t('c_games')}</th></tr></thead><tbody>`;
  const mp=Math.max(...s.duos.map(x=>x[4]),0.01);
  s.duos.forEach((c,i)=>{
    const hs=c[0].split('+');
    h+=`<tr><td class="rank ${medalCls(i+1)}">${i+1}</td>
      <td><span class="comp">${hs.map(x=>heroImg(x)).join('')}<b>${hs.map(x=>hk(x)).join(' · ')}</b></span></td>
      <td class="num wr ${wrClass(c[3])}">${c[3]}%</td>
      <td class="num hcol"><span class="bar"><i style="width:${Math.round(c[4]/mp*100)}%"></i></span> <span class="muted">${c[4]}%</span></td>
      <td class="num">${c[1].toLocaleString()}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}

// 필터는 글자를 칠 때마다 목록을 다시 그린다. 이때 화면 전체를 다시 그리면 입력창까지
// 새로 만들어져서 한글 조합이 끊긴다(ㅂ 두 번 눌러 ㅍ을 만들려 해도 "ㅂㅂ"이 됨).
// 그래서 입력창은 그대로 두고 목록(#boardBody)과 개수 표시만 갈아끼운다.
window.onFilterInput=el=>{
  curFilter=el.value; curPage=0;
  const body=document.getElementById('boardBody');
  if(!body){ render(); return; }
  body.innerHTML=boardBodyHtml();
  const cnt=document.getElementById('boardCount');
  if(cnt) cnt.innerHTML=boardCountHtml();
};
// ── 순위 변동 ────────────────────────────────────────────────
// 서버가 매일 0시(KST) 랭킹을 기준선으로 저장하고, rdelta에 [지금 - 기준선] 차이만 실어준다.
// 즉 여기 숫자는 "오늘 들어 몇 계단 올랐나". 기준선이 없는 첫날엔 rdelta가 비어 온다.
const RDELTA=()=>((D.rdelta||{})[curSeason]||{});
function deltaHtml(board,pid){
  const v=(RDELTA()[board]||{})[pid];
  if(v==null||v===0) return '';
  if(v==='N') return `<span class="dlt new">${t('rank_new')}</span>`;
  return v>0?`<span class="dlt up">▲${v}</span>`:`<span class="dlt dn">▼${-v}</span>`;
}
function moversHtml(){
  const rb=D.rbase||{};
  if(!rb.days) return '';                       // 이력 기능이 없는(옛) 데이터
  const d=RDELTA()[curBoard]||{};
  const ups=Object.entries(d).filter(([,v])=>typeof v==='number'&&v>0)
    .sort((a,b)=>b[1]-a[1]).slice(0,5);
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);   // 서버 기준일이 KST라 맞춰서 비교
  const note=rb.day===today?t('movers_note'):t('movers_since',{d:rb.day||'-'});
  if(!ups.length){
    // 기준선만 잡힌 첫날. 기능이 죽은 게 아니라 쌓는 중이라는 걸 알려준다.
    return rb.days<=1?`<div class="card"><div class="movers"><span class="muted" style="font-size:12.5px">${t('movers_wait')}</span></div></div>`:'';
  }
  let h=`<div class="sect-t">${ICON.trophy} ${t('movers_up')} <span class="muted" style="font-size:12px;font-weight:400">${note}</span></div>`;
  h+='<div class="card"><div class="movers">';
  for(const [pid,v] of ups){
    const p=P[pid]; if(!p) continue;
    h+=`<span class="mv" onclick="goPlayer('${pid}')"><b>${esc(p.n)}</b><i>▲${v}</i></span>`;
  }
  return h+'</div></div>';
}
// ⚠️ 랭킹 보드에는 있는데 players에 아직 없는 유저가 생긴다(방금 랭킹에 진입한 신규 유저).
//    P[id]를 그냥 쓰면 undefined.r 로 예외가 나고 **화면이 통째로 안 그려진다**
//    (2026-08-05: 7월 프로 첫 페이지에 그런 유저가 걸려 "프로를 눌러도 반응 없음"으로 나타났다).
//    서버가 다음 갱신에서 채워주지만, 그 사이에도 화면은 살아 있어야 한다.
const PL=id=>P[id]||{};
function boardRows(){
  const ids=B[curBoard]||[];
  let rows=ids.map((id,i)=>({id,rank:i+1}));
  if(curRegion) rows=rows.filter(r=>PL(r.id).r===curRegion);
  if(curFilter){const f=curFilter.toLowerCase(); rows=rows.filter(r=>(PL(r.id).n||'').toLowerCase().includes(f));}
  return rows;
}
function boardCountHtml(){
  const size=BM[curBoard]?.size||(B[curBoard]||[]).length;
  return `${boardLabel(curBoard)} · ${t('total_n',{n:size.toLocaleString()})}${curRegion?` · ${regionName(curRegion)} ${boardRows().length.toLocaleString()}`:''}`;
}
function boardBodyHtml(){
  const rows=boardRows();
  const total=rows.length, pages=Math.max(1,Math.ceil(total/PAGE));
  if(curPage>=pages)curPage=0;
  const slice=rows.slice(curPage*PAGE,curPage*PAGE+PAGE);
  let h=`<div class="card" style="overflow-x:auto"><table><thead><tr><th class="rank">${t('c_rank')}</th><th>${t('c_name')}</th><th class="num">${t('c_score')}</th><th class="num">${t('c_wr')}</th><th class="num hcol">${t('c_level')}</th><th class="num hcol">${t('c_mvp')}</th></tr></thead><tbody>`;
  if(!slice.length) h+=`<tr><td colspan="6" class="empty">${t('no_result')}</td></tr>`;
  for(const r of slice){const p=PL(r.id);const sc=(((p.rk||{})[curSeason]||{})[curBoard]||[])[1];   // rk는 {시즌:{보드:[순위,점수]}}
    // 아직 프로필을 못 받은 유저는 이름 자리를 '…'로 둔다(다음 갱신에서 채워진다)
    h+=`<tr onclick="goPlayer('${r.id}')"><td class="rank ${medalCls(r.rank)}">${r.rank}${deltaHtml(curBoard,r.id)}</td>
      <td><span class="name">${p.n?esc(p.n):'<span class="muted">…</span>'}</span><span class="reg">${esc(regionName(p.r))}</span></td>
      <td class="num">${sc!=null?sc.toLocaleString():'-'}</td>
      <td class="num wr ${wrClass(p.wr)}">${p.wr!=null?p.wr+'%':'-'}</td>
      <td class="num hcol">${p.lv??'-'}</td><td class="num hcol">${p.mvp!=null?p.mvp.toLocaleString():'-'}</td></tr>`;
  }
  h+='</tbody></table>';
  // 페이지 이동은 목록만 다시 그린다(입력창 유지)
  h+=`<div class="pager"><button onclick="goPage(0)" ${curPage===0?'disabled':''}>«</button>
    <button onclick="goPage(${curPage-1})" ${curPage===0?'disabled':''}>${t('prev')}</button>
    <span>${curPage+1} / ${pages}</span>
    <button onclick="goPage(${curPage+1})" ${curPage>=pages-1?'disabled':''}>${t('next')}</button>
    <button onclick="goPage(${pages-1})" ${curPage>=pages-1?'disabled':''}>»</button></div></div>`;
  return h;
}
window.goPage=n=>{
  curPage=Math.max(0,n);
  const body=document.getElementById('boardBody');
  if(body) body.innerHTML=boardBodyHtml(); else render();
};
// 프로 시즌은 캐주얼과 주기가 다르다 — 2026-08 실측: 캐주얼은 202608인데 프로는 202607이
// 8/15까지 이어진다. 서버가 진행 중인 프로 보드를 이번 달 탭에 붙여 주므로(안 그러면
// "8월엔 프로가 없다"가 된다), 그게 실제로 어느 시즌인지는 여기서 밝힌다.
const kstStamp=ts=>{const d=new Date((ts+9*3600)*1000).toISOString();
  return d.slice(5,7)+'/'+d.slice(8,10)+' '+d.slice(11,16);};
function proNoteHtml(){
  const m=BM[curBoard];
  if(curBoard!=='pro'||!m||!m.season||m.season===curSeason) return '';
  let s=t('pro_season_note',{s:seasonLabel(m.season)});
  if(m.next_ts) s+=' · '+t('pro_season_next',{d:kstStamp(m.next_ts)});
  return `<div class="muted" style="margin:-4px 0 10px;font-size:12px">${s}</div>`;
}
function renderBoard(){
  let h=tabsHtml();
  h+=proNoteHtml();
  h+=`<div class="row-filter">${regionOptions()}
    <input class="mini" id="boardFilter" placeholder="${t('find_in_board')}" value="${esc(curFilter)}" oninput="onFilterInput(this)" style="flex:1;min-width:140px">
    <span class="muted" id="boardCount">${boardCountHtml()}</span></div>`;
  h+=moversHtml();              // 오늘 많이 오른 유저 (지역·페이지와 무관하게 보드 전체 기준)
  h+=`<div id="boardBody">${boardBodyHtml()}</div>`;
  app.innerHTML=h;
}

// site_data.js에는 목록에 필요한 필드만 들어있다(D.slim). 프로필을 처음 열 때
// 나머지(캐릭터별 상세·최근경기·킬/데미지)를 /api/detail 로 한 번 받아 P에 합친다.
// 서버가 메모리 캐시에서 바로 주므로 1KB·즉시. 실패해도 있는 정보만으로 그린다.
function fetchDetail(id,p){
  p._d=1;                                   // 한 번만 시도 (실패시 무한루프 방지)
  const again=()=>{ if(location.hash==='#/player/'+id) renderPlayer(id); };
  fetch('/api/detail/'+encodeURIComponent(id))
    .then(r=>r.json())
    .then(j=>{ if(j.ok&&j.player) P[id]=Object.assign(P[id]||{},j.player,{_d:1}); again(); })
    .catch(again);
}
function renderPlayer(id){
  // ⚠️ P['__proto__']는 Object.prototype이라 truthy다. 그대로 두면 프로필 객체로 오인해
  //    프로토타입에 값을 심고 화면이 멈춘다. 실제로 가진 키인지 확인한다.
  const p=Object.prototype.hasOwnProperty.call(P,id)?P[id]:undefined;
  if(p && D.slim && !p.h && !p._d){
    fetchDetail(id,p);
    app.innerHTML=`<div class="card"><div class="empty">${t('loading')}</div></div>`;
    return;
  }
  if(!p){
    if(window.LIVE){ app.innerHTML=`<div class="card"><div class="empty">${t('loading')}</div></div>`;
      // ⚠️ 성공/실패/오류 **모든** 경로에서 "아직 이 화면인가"를 확인한다.
      //    확인 안 하면 늦게 온 응답이 사용자가 이동한 새 화면을 덮어쓴다.
      const here=()=>location.hash==='#/player/'+id;
      fetch('/api/player/'+encodeURIComponent(id)).then(r=>r.json())
        .then(j=>{ if(j.ok&&j.player){ P[id]=j.player; if(here()) renderPlayer(id); }
                   else if(here()) app.innerHTML=`<div class="card"><div class="empty">${t('no_user')}</div></div>`; })
        .catch(()=>{ if(here()) app.innerHTML=`<div class="card"><div class="empty">${t('load_error')}</div></div>`; });
      return;
    }
    app.innerHTML=`<div class="card"><div class="empty">${t('no_user')}</div></div>`; return;
  }
  const init=(p.n.trim()[0]||'?').toUpperCase();
  // 대표 캐릭터 = 플레이시간 1위 (아바타로 사용)
  const mainHero=Object.entries(p.h||{}).filter(([,v])=>v.lv!=null)
    .sort((a,b)=>(b[1].pt||0)-(a[1].pt||0))[0]?.[0];
  const avatar=mainHero?`<img src="img/hero/${mainHero.toLowerCase()}.png" alt="" onerror="this.parentNode.textContent='${esc(init)}'"><span class="mh">${hk(mainHero)}</span>`:esc(init);
  let h=`<a class="back" onclick="history.back()">← ${t('back')}</a>`;
  const liveBtn=window.LIVE?`<button class="btn" id="refreshBtn" onclick="refreshPlayer('${id}')" style="margin-left:auto">${ICON.refresh} ${t('refresh')}</button>`:'';
  h+=`<div class="card"><div class="pf-top">
    <div class="pf-av">${avatar}</div>
    <div><div class="pf-name">${esc(p.n)}</div>
    <div class="muted">${esc(regionName(p.r))} · ${t('level')} ${p.lv??'-'}${mainHero?' · '+t('main_hero')+' '+hk(mainHero):''}</div>
    ${p.prev&&p.prev.length?`<div style="font-size:12px;margin-top:4px"><span class="muted">${t('prev_names')} </span>${p.prev.map(pn=>`<span style="display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 0 0;color:var(--acc2);font-weight:600">${esc(pn)}</span>`).join('')}</div>`:''}
    <div class="muted" id="freshInfo" style="font-size:11px"></div></div>
    ${liveBtn}</div>`;
  const fmt=n=>n!=null?n.toLocaleString():'-';
  h+=`<div class="stat-grid">
    <div class="stat"><div class="k">${t('s_wr')}</div><div class="v ${wrClass(p.wr)}">${p.wr!=null?p.wr+'%':'-'}</div></div>
    <div class="stat"><div class="k">${t('s_kd')}</div><div class="v">${p.kd??'-'}</div></div>
    <div class="stat"><div class="k">${t('s_kills_deaths')}</div><div class="v" style="font-size:16px">${fmt(p.k)} / ${fmt(p.d)}</div></div>
    <div class="stat"><div class="k">${t('s_matches')}</div><div class="v">${fmt(p.m)}</div></div>
    <div class="stat"><div class="k">${t('s_wins')}</div><div class="v">${fmt(p.w)}</div></div>
    <div class="stat"><div class="k">${t('c_mvp')}</div><div class="v">${fmt(p.mvp)}</div></div>
    <div class="stat"><div class="k">${t('s_playtime')}</div><div class="v">${p.pt!=null?t('hours_unit',{n:p.pt}):'-'}</div></div>
    <div class="stat"><div class="k">${t('s_damage')}</div><div class="v" style="font-size:16px">${fmt(p.dmg)}</div></div>
    ${p.pm?`<div class="stat"><div class="k">${t('s_pro_matches')}</div><div class="v">${fmt(p.pm)}</div></div>`:''}
  </div></div>`;
  // 랭킹 (모드 + 캐릭터)
  const rk=(p.rk&&p.rk[curSeason])||{};   // 랭킹은 {시즌:{보드:[순위,점수]}}
  const modeRows=['pro','casual'].filter(m=>rk[m]);
  const heroRows=SD().hero_labels.filter(hl=>rk[hl]).sort((a,b)=>rk[a][0]-rk[b][0]);
  h+=`<div class="sect-t">${ICON.trophy} ${t('rank_section')} (${t('season')} ${seasonLabel(curSeason)})</div><div class="card" style="overflow-x:auto"><table>
    <thead><tr><th>${t('c_type')}</th><th class="num">${t('c_rank')}</th><th class="num">${t('c_score')}</th><th class="hcol">${t('c_top_pct')}</th></tr></thead><tbody>`;
  const addRow=(lab,isHero)=>{const [rank,score]=rk[lab];const size=BM[lab]?.size||rank;const pct=Math.max(0.1,(rank/size*100));
    h+=`<tr><td>${isHero?ICON.target+' ':''}${boardLabel(lab)}</td><td class="num rank ${medalCls(rank)}" style="text-align:right">${rank.toLocaleString()}${deltaHtml(lab,id)}</td>
      <td class="num">${score.toLocaleString()}</td>
      <td class="hcol"><span class="pct"><i style="width:${Math.min(100,pct)}%"></i></span> <span class="muted">${pct.toFixed(1)}%</span></td></tr>`;};
  if(!modeRows.length&&!heroRows.length) h+=`<tr><td colspan="4" class="empty">${t('no_rank')}</td></tr>`;
  modeRows.forEach(m=>addRow(m,false));
  heroRows.forEach(hl=>addRow(hl,true));
  h+='</tbody></table></div>';
  // 캐릭터별 상세 (레벨·플레이시간·레이팅·스킨)
  const H=p.h||{};
  const hero_list=Object.keys(H).filter(hn=>H[hn].lv!=null)
    .sort((a,b)=>(H[b].pt||0)-(H[a].pt||0));
  if(hero_list.length){
    h+='<div class="sect-t">'+ICON.target+' '+t('hero_detail')+'</div><div class="card">';
    for(const hn of hero_list){const hd=H[hn];const seasonRank=rk[hn]?t('season_rank',{r:rk[hn][0].toLocaleString()}):null;
      h+=`<div class="hrow">
        <div><span class="hn">${heroImg(hn,'hi-lg')}${hk(hn)}</span><span class="lv">Lv.${hd.lv??'-'}</span></div>
        <div class="hm"><span class="m1">⏱ ${hd.pt!=null?t('hours_unit',{n:hd.pt}):'-'}</span><span class="m2">${t('c_rating')} <b>${hd.rt!=null?hd.rt.toLocaleString():'-'}</b></span><span class="m3">${seasonRank||'<span class="dim">–</span>'}</span><span class="m4">${hd.sk?'🎨 '+esc(hd.sk):'<span class="dim">–</span>'}</span></div>
        ${(hd.pk&&hd.pk.length)?`<div class="pk"><span class="pkl">${t('perks')}</span>${perkChips(hd.pk)}</div>`:''}
      </div>`;
    }
    h+='</div>';
  }
  // 최근 경기
  h+='<div class="sect-t">'+ICON.history+' '+t('recent')+' <span id="matchInfo" class="muted" style="font-size:12px;font-weight:400"></span></div><div id="matchBox">';
  if(p.matches&&p.matches.length){ h+=matchesHtml(p.matches); }
  else if(window.LIVE){ h+=`<div class="card"><div class="empty">${t('live_hint')}</div></div>`; }
  else { h+=`<div class="card"><div class="empty">${t('static_hint')}</div></div>`; }
  h+='</div>';
  app.innerHTML=h; window.scrollTo(0,0);
  const mi=document.getElementById('matchInfo');
  if(mi&&p.matches&&p.matches.length) mi.innerHTML=recentSummary(p.matches);
  // 실시간 모드면 경기 자동 로드 (한 번만)
  if(window.LIVE && !p.matches && !p._tried){ p._tried=true; refreshPlayer(id); }
}

// 최근 경기에서 프로/캐주얼 전적을 계산한다.
// 게임은 프로 전용 승수를 세지 않아서(카운터 자체가 없음) 통산은 못 구하고,
// 서버가 주는 최근 25경기 범위에서만 낼 수 있다.
function recentSummary(matches){
  if(!matches||!matches.length) return '';
  const s={1:{w:0,l:0},2:{w:0,l:0}};
  matches.forEach(m=>{const b=s[m.type]; if(b) b[m.win?'w':'l']++;});
  const part=k=>{const b=s[k], n=b.w+b.l; if(!n) return null;
    const wr=Math.round(b.w/n*1000)/10;
    return `${k===1?t('tab_pro'):t('tab_casual')} <b>${b.w}${t('win')} ${b.l}${t('lose')}</b> (${wr}%)`;};
  const arr=[part(1),part(2)].filter(Boolean);
  return arr.length?`${t('recent_n',{n:matches.length})} · ${arr.join(' · ')}`:'';
}
function matchesHtml(matches){
  const typeName=v=>v===1?t('tab_pro'):v===2?t('tab_casual'):'-';
  const ago=ts=>{if(!ts)return'';const s=Math.floor(Date.now()/1000-ts);
    if(s<3600)return t('ago_min',{n:Math.floor(s/60)});
    if(s<86400)return t('ago_hour',{n:Math.floor(s/3600)});
    return t('ago_day',{n:Math.floor(s/86400)});};
  const dur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'';
  const num=n=>n!=null?n.toLocaleString():'-';
  if(!matches||!matches.length) return `<div class="card"><div class="empty">${t('no_match')}</div></div>`;
  let h='<div class="card" style="overflow-x:auto"><table class="mtab"><thead><tr>'
    +`<th>${t('c_result')}</th><th>${t('c_hero')}</th><th>${t('c_map_mode')}</th><th class="num">${t('c_kd')}</th><th class="num hcol">${t('c_dmg')}</th><th class="num hcol">${t('c_rating')}</th><th>${t('c_time')}</th></tr></thead><tbody>`;
  matches.forEach((m,i)=>{
    const cls=m.win?'win':'loss';
    const rb=`<span class="rb ${cls}">${m.win?t('win'):t('lose')}</span>`;
    const mvp=m.mvpme?'<span class="mvpb">MVP</span>':'';
    h+=`<tr class="mrow ${cls}" onclick="toggleMatch(${i})">
      <td><div style="display:flex;align-items:center;gap:5px">${rb}${mvp}<span class="muted" style="font-variant-numeric:tabular-nums">${m.mys}-${m.ens}</span></div></td>
      <td class="hcell">${heroImg(m.myhero)}${esc(hk(m.myhero))}</td>
      <td>${esc(mapName(m.map))||'-'}<span class="muted mmode"> · ${typeName(m.type)} · ${dur(m.dur)}</span></td>
      <td class="num">${m.myk??'-'} / ${m.myd??'-'}<span class="mdmg">${t('dmg_abbr')} ${num(m.dmg)}</span></td>
      <td class="num hcol">${num(m.dmg)}</td>
      <td class="num hcol">${num(m.myrt)}</td>
      <td class="muted">${ago(m.ts)}${m.mid?`<div><span class="mcode" title="${t('replay_code')}" onclick="event.stopPropagation();copyCode(this,'${esc(m.mid)}')">🎬 ${esc(m.mid)}</span></div>`:''}</td></tr>`;
    const statsOf=x=>{const a=[];
      if(x.mvp) a.push(`${t('score_abbr')} <b>${x.mvp.toLocaleString()}</b>`);
      if(x.dmg!=null) a.push(`${t('dmg_abbr')} <b>${x.dmg.toLocaleString()}</b>`);
      return a.length?`<span class="sbst">${a.join(' · ')}</span>`:'';};
    const perksOf=x=>{
      const gs=(x.hp&&x.hp.length)?x.hp:[]; const st=statsOf(x);
      if(!gs.length) return st?`<div class="sbp">${st}</div>`:'';
      return gs.map((g,gi)=>`<div class="sbp">${gs.length>1?`<span class="hh">${esc(hk(g.h))}</span>`:''}${perkChips(g.pk,1)}${gi===0?st:''}</div>`).join('');};
    const side=arr=>{
      // 파티 판별: 같은 팀에서 같은 sq 값이 2명 이상이면 같이 큐 돌린 것 (서버가 SquadId에서 추출)
      const cnt={}; arr.forEach(x=>{if(x.sq)cnt[x.sq]=(cnt[x.sq]||0)+1;});
      const parties=Object.keys(cnt).filter(k=>cnt[k]>=2);
      return arr.map(x=>{
        const tag=x.bot?`<span class="sbbot">${t('bot')}</span>`
          :(x.sq&&parties.includes(x.sq))?`<span class="sbparty">${t('party')}${parties.length>1?parties.indexOf(x.sq)+1:''}</span>`:'';
        const nm=x.bot?`<span class="muted">${esc(x.n)}</span>`   // 봇은 프로필이 없다 — 링크 없이 흐리게
          :(x.id?`<span class="plink" onclick="event.stopPropagation();goPlayer('${x.id}')">${esc(x.n)}</span>`:esc(x.n));
        return `<div class="sbl${x.me?' me':''}"><span class="sbn">${heroImg(x.h)}${esc(hk(x.h))} · ${nm}${tag}</span>${x.mv?'<span class="sbmvp">MVP</span>':''}<span class="sbk">${x.k??0}/${x.d??0}</span></div>${perksOf(x)}`;
      }).join('');
    };
    const meP=m.players.find(x=>x.me); const myTeam=meP?meP.tm:1;
    const t1=m.players.filter(x=>x.tm===myTeam),t2=m.players.filter(x=>x.tm!==myTeam);
    h+=`<tr class="mdet" id="md${i}" style="display:none"><td colspan="7">
      ${m.avg?`<div class="muted" style="font-size:11px;padding:4px 2px 0">${t('avg_rt')} <b style="color:var(--tx)">${num(m.avg)}</b></div>`:''}
      <div style="display:flex;gap:24px;flex-wrap:wrap;padding:4px 2px;font-size:12px">
        <div class="sbteam ally"><div class="sbhead"><span class="muted">${t('our_team')} · </span><b style="color:${m.win?'var(--win)':'var(--lose)'}">${m.mys}</b></div>${side(t1)}</div>
        <div class="sbteam foe"><div class="sbhead"><span class="muted">${t('enemy_team')} · </span><b>${m.ens}</b></div>${side(t2)}</div>
      </div></td></tr>`;
  });
  return h+'</tbody></table></div>';
}
// 리플레이 코드 복사. 게임의 리플레이 메뉴에 이 코드를 넣으면 그 경기를 볼 수 있다.
window.copyCode=(el,code)=>{const done=()=>{const o=el.innerHTML;el.classList.add('ok');el.innerHTML='✓ '+t('copied');setTimeout(()=>{el.classList.remove('ok');el.innerHTML=o;},1200);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(()=>{});}
  else{const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);try{document.execCommand('copy');done();}catch(e){}}};
window.toggleMatch=i=>{const el=document.getElementById('md'+i);if(el)el.style.display=el.style.display==='none'?'':'none';};
// 옛 닉네임 매치는 여러 개일 수 있다(6번 바꿨으면 6개 다 검색 대상).
// 서버는 배열, 옛 응답·클라 폴백은 문자열이라 양쪽 다 받는다.
// ⚠️ 빈 배열도 참이라 `it.prevMatch ? ...` 로 판단하면 안 된다(정렬이 밀린다).
const pmList=it=>Array.isArray(it.prevMatch)?it.prevMatch.filter(Boolean):(it.prevMatch?[it.prevMatch]:[]);
function searchRow(it){
  let best='',bestRank=1e9; const rk=(it.rk&&it.rk[curSeason])||{};
  for(const lab in rk){if(rk[lab][0]<bestRank){bestRank=rk[lab][0];best=boardLabel(lab)+' '+t('rank_suffix',{r:rk[lab][0]});}}
  const pm=pmList(it);
  const prevTag=pm.length?`<div class="muted" style="font-size:11px">↳ ${t('old_nick')} <b>${pm.map(esc).join('</b>, <b>')}</b> → ${t('now_nick')} <b>${esc(it.n)}</b></div>`:'';
  return `<tr onclick="goPlayer('${it.id}')"><td><span class="name">${esc(it.n)}</span>${prevTag}</td><td class="muted">${esc(regionName(it.r))}</td>`
    +`<td class="num wr ${wrClass(it.wr)}">${it.wr!=null?it.wr+'%':'-'}</td><td class="num">${it.lv??'-'}</td><td class="muted hcol">${best||'-'}</td></tr>`;
}
function renderSearchResults(q,items){
  const f=q.toLowerCase();
  items.sort((a,b)=>{const rk=x=>{const n=(x.n||'').toLowerCase();return n===f?0:n.startsWith(f)?1:(pmList(x).length?3:2);};return rk(a)-rk(b);});
  let h=`<a class="back" onclick="goBoard('pro')">← ${t('to_ranking')}</a><div class="sect-t">${t('sr_title',{q:esc(q),n:items.length})}${items.length>=300?'+':''}</div>`;
  h+=`<div class="card" style="overflow-x:auto"><table><thead><tr><th>${t('c_name')}</th><th>${t('sr_region')}</th><th class="num">${t('c_wr')}</th><th class="num">${t('c_level')}</th><th class="hcol">${t('sr_best')}</th></tr></thead><tbody>`;
  if(!items.length) h+=`<tr><td colspan="5" class="empty">${t('no_result')}</td></tr>`;
  for(const it of items) h+=searchRow(it);
  h+='</tbody></table></div>'; app.innerHTML=h;
}
function clientSearch(q){
  const f=q.toLowerCase(); const byId={};
  // 옛 닉네임이 여러 개 걸리면 전부 모은다. cur이 걸린 사람은 옛 이름 표시를 비운다(서버와 동일).
  for(const [nm,id,prevName] of NAMEIDX){
    if(!nm.includes(f))continue;
    if(!byId[id])byId[id]={id,prevMatch:[],curHit:false};
    if(prevName){ if(!byId[id].prevMatch.includes(prevName)) byId[id].prevMatch.push(prevName); }
    else byId[id].curHit=true;
  }
  return Object.values(byId).slice(0,300).map(o=>{const p=P[o.id]||{};return {id:o.id,n:p.n,r:p.r,wr:p.wr,lv:p.lv,prevMatch:o.curHit?[]:o.prevMatch,rk:p.rk};});
}
function renderSearch(q){
  if(window.LIVE){   // 서버 실시간 검색 (개명 즉시 반영, 현재 닉네임으로 표시)
    app.innerHTML=`<a class="back" onclick="goBoard('pro')">← ${t('to_ranking')}</a><div class="sect-t">${t('searching')}</div>`;
    // ⚠️ 검색 응답은 1초 안팎 걸린다. 그 사이 로고를 누르면 화면이 바뀌는데,
    //    가드가 없으면 뒤늦게 도착한 검색 결과가 그 화면을 덮어쓴다(실제 발생했던 증상).
    // 가드: "아직 이 검색 화면인가". 해시 인코딩 형태가 달라질 수 있으니 디코딩해서 검색어로 비교한다.
    const onSearch=()=>{const h=decodeHash(); return h.startsWith('#/search/')&&h.slice(9).trim()===q;};
    fetch('/api/search?q='+encodeURIComponent(q)).then(r=>r.json())
      .then(j=>{ if(onSearch()) renderSearchResults(q,(j.results||[]).map(r=>({id:r.id,n:r.n,r:r.r,wr:r.wr,lv:r.lv,prevMatch:r.pm,rk:r.rk}))); })
      .catch(()=>{ if(onSearch()) renderSearchResults(q,clientSearch(q)); });
    return;
  }
  renderSearchResults(q,clientSearch(q));
}

// 라우팅
// ⚠️ 해시가 이미 같으면 브라우저는 hashchange를 안 쏜다. 그런데 전역 변수(curFilter 등)는
//    이미 바뀐 뒤라, 화면만 옛 상태로 남아 어긋난다.
//    (재현: 필터 "ki" 입력 → 이미 켜진 탭을 다시 클릭 → 지역 선택 → 입력창엔 ki가 남았는데 목록은 전체)
//    그래서 해시가 같으면 render()를 직접 부른다.
// 해시를 안전하게 디코딩(잘린 %가 있어도 던지지 않는다). 화면 비교용.
function decodeHash(){ try{ return decodeURIComponent(location.hash||''); }catch(e){ return location.hash||''; } }
function goHash(h){ if(location.hash===h) render(); else location.hash=h; }
// 로고/첫 진입은 '프로'로 고정돼 있었는데, 시즌 초엔 프로 보드가 없어서
// 주소는 #/board/pro인데 화면은 캐주얼이 뜨는 불일치가 났다. 있는 보드로 보낸다.
function firstBoard(){ return (B['pro']?'pro':(B['casual']?'casual':Object.keys(B)[0]))||'pro'; }
window.goHome=()=>goBoard(firstBoard());
function goBoard(b){if(!b)return;curBoard=b;curPage=0;curFilter='';goHash('#/board/'+encodeURIComponent(b));}
function goPlayer(id){goHash('#/player/'+id);}
function doSearch(){const q=document.getElementById('q').value.trim();if(q)goHash('#/search/'+encodeURIComponent(q));}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});


// ── 개명 이력 ─────────────────────────────────────────
// 서버(/api/renamed)가 닉네임 이력을 통째로 준다. 프로필의 '이전 닉네임'과 같은 데이터를
// 목록으로 모아 본 것 — 누가 언제 이름을 바꿨는지 한 화면에서 본다.
// ⚠️ 시즌과 무관한 화면이다(SEASONLESS). 한 번 받으면 캐시해 두고 지역 필터만 다시 그린다.
let rnCache=null, rnRg='';
const RN_GROUPS=[['ap','ap-northeast-2'],['eu','eu-central-1'],['us','us-east-1']];
function rnGroup(r){r=String(r||'');for(const g of RN_GROUPS) if(r.indexOf(g[0]+'-')===0) return g[0];return 'etc';}
function rnLabel(k){const g=RN_GROUPS.find(x=>x[0]===k);return g?regionName(g[1]):t('rg_etc');}
function rnAgo(ts){if(!ts)return'';const s=Math.floor(Date.now()/1000-ts);
  if(s<3600)return t('ago_min',{n:Math.floor(s/60)});
  if(s<86400)return t('ago_hour',{n:Math.floor(s/3600)});
  return t('ago_day',{n:Math.floor(s/86400)});}
window.goRenamedRg=k=>{rnRg=k;paintRenamed();};
function renderRenamed(){
  if(rnCache) return paintRenamed();
  app.innerHTML=tabsHtml()+`<div class="card"><div class="empty">${t('loading')}</div></div>`;
  fetch('/api/renamed').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    .then(j=>{rnCache=j; if(curBoard==='renamed') paintRenamed();})
    .catch(e=>{ if(curBoard!=='renamed') return;
      app.innerHTML=tabsHtml()+`<div class="card"><div class="empty">${t('rn_fail')} (${esc(String(e.message||e))})</div></div>`;});
}
function paintRenamed(){
  const all=(rnCache&&rnCache.players)||[];
  const cnt={}; for(const p of all){const g=rnGroup(p.r); cnt[g]=(cnt[g]||0)+1;}
  if(rnRg&&!cnt[rnRg]) rnRg='';
  const rows=rnRg?all.filter(p=>rnGroup(p.r)===rnRg):all;
  let h=tabsHtml();
  const btns=[{k:'',label:t('all_regions'),n:all.length}];
  for(const g of RN_GROUPS) if(cnt[g[0]]) btns.push({k:g[0],label:rnLabel(g[0]),n:cnt[g[0]]});
  if(cnt.etc) btns.push({k:'etc',label:t('rg_etc'),n:cnt.etc});
  h+='<div class="tabs" style="margin-top:10px">'+btns.map(b=>
    `<div class="tab ${rnRg===b.k?'on':''}" onclick="goRenamedRg('${b.k}')">${esc(b.label)} <span style="font-size:11px;opacity:.7">${b.n.toLocaleString()}</span></div>`).join('')+'</div>';
  h+=`<div class="sect-t">${t('rn_title')}<span class="muted" style="font-size:12px;font-weight:400">${t('total_n',{n:rows.length.toLocaleString()})}`
    +`${(rnCache&&rnCache.names)?' · '+t('rn_tracked',{n:rnCache.names.toLocaleString()}):''}</span></div>`;
  h+=`<div class="card" style="overflow-x:auto"><table><thead><tr><th>${t('rn_cur')}</th><th>${t('prev_names')}</th>`
    +`<th class="num">${t('rn_times')}</th><th class="hcol">${t('sr_region')}</th><th class="hcol">${t('rn_last')}</th></tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="5" class="empty">${t('rn_none')}</td></tr>`;
  for(const p of rows){
    const chips=(p.prev||[]).map(pn=>`<span class="rnchip">${esc(pn)}</span>`).join('');
    h+=`<tr ${p.id?`onclick="goPlayer('${p.id}')" style="cursor:pointer"`:''}>`
      +`<td><span class="name">${esc(p.n||'')}</span></td><td style="font-size:12px">${chips}</td>`
      +`<td class="num">${(p.prev||[]).length}</td><td class="muted hcol">${esc(regionName(p.r))}</td>`
      +`<td class="muted hcol" style="font-size:12px">${rnAgo(p.ts)}</td></tr>`;
  }
  app.innerHTML=h+'</tbody></table></div>';
}

function render(){
  hidePerkTip();
  // ⚠️ 잘린 퍼센트 인코딩(#/search/%)이면 decodeURIComponent가 던진다. 그러면 이 화면 전환이 통째로 무시된다.
  let h=location.hash||'';
  try{ h=decodeURIComponent(h); }catch(e){}
  if(h.startsWith('#/player/')) return renderPlayer(h.slice(9));
  if(h.startsWith('#/search/')) return renderSearch(h.slice(9).trim());   // 주소로 들어온 검색어도 공백 정리
  if(h.startsWith('#/board/')){curBoard=h.slice(8)||'pro';}
  syncSeasonSel();
  if(curBoard==='tiers') return renderTiers();
  if(curBoard==='comps') return renderComps();
  if(curBoard==='renamed') return renderRenamed();
  if(!B[curBoard]) curBoard = B['pro']?'pro':(B['casual']?'casual':Object.keys(B)[0]||'pro');
  renderBoard();
}
window.addEventListener('hashchange',render);

// 실시간 새로고침 (백엔드 서버가 있을 때만)
window.LIVE=false;
async function refreshPlayer(id){
  const btn=document.getElementById('refreshBtn'); if(btn){btn.disabled=true;btn.textContent=t('loading_live');}
  // ⚠️ 이 조회는 1초 안팎 걸린다. 그동안 사용자가 로고를 누르거나 다른 화면으로 갈 수 있다.
  //    끝났다고 무조건 다시 그리면 **보고 있던 새 화면을 프로필이 덮어쓴다.**
  //    (증상: 로고를 눌러 첫 화면이 잠깐 보였다가 다시 프로필로 돌아감)
  //    그래서 결과를 반영하기 전에 "아직 그 프로필 화면인가"를 확인한다.
  const still=()=>location.hash==='#/player/'+id;
  try{
    const r=await fetch('/api/player/'+id); const j=await r.json();
    if(j.ok&&j.player){
      P[id]=Object.assign(P[id]||{},j.player);        // 받아온 데이터는 화면과 무관하게 캐시에 보관
      if(!still()) return;                            // 이미 다른 화면 → 그리지 않는다
      renderPlayer(id);
      const fi=document.getElementById('freshInfo'); if(fi) fi.textContent=t('just_refreshed')+' ✓';
    } else {
      if(!still()) return;
      if(btn){btn.disabled=false;btn.innerHTML=ICON.refresh+' '+t('refresh');} alert(t('load_fail'));
    }
  }catch(e){
    if(!still()) return;                              // 떠난 뒤에 경고창이 튀어나오지 않게
    if(btn){btn.disabled=false;btn.innerHTML=ICON.refresh+' '+t('refresh');} alert(t('conn_fail')+': '+e);
  }
}
function timeAgo(ts){if(!ts)return'';const s=Math.floor(Date.now()/1000-ts);
  if(s<60)return t('ago_sec',{n:s});
  if(s<3600)return t('ago_min',{n:Math.floor(s/60)});
  return t('ago_hour',{n:Math.floor(s/3600)});}
fetch('/api/status').then(r=>r.json()).then(st=>{
  if(st&&st.live){ window.LIVE=true;
    const b=document.getElementById('seasonBadge');   // 없을 수 있다(예외 나면 아래 render()가 안 돌아 실시간 버튼이 안 뜸)
    if(b&&st.last_refresh) b.title=timeAgo(st.last_refresh);
    if(location.hash.startsWith('#/player/')) render(); // 버튼 노출 위해 재렌더
  }
}).catch(()=>{});

//__X__
applyStatic();
if(!location.hash) location.hash='#/board/'+firstBoard(); else render();
</script>
